<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<title>Hiss — çox oyunu v3</title>
<style>
@font-face{font-family:"Unb";font-weight:800;src:url(fonts/unbounded-latin-800-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Unb";font-weight:800;src:url(fonts/unbounded-latin-ext-800-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Unb";font-weight:900;src:url(fonts/unbounded-latin-900-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Unb";font-weight:900;src:url(fonts/unbounded-latin-ext-900-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+2C60-2C7F,U+A720-A7FF}
:root{--ink:#16131F;--cream:#FFF4E6;--coral:#FF4F2E;--lav:#C7B5FF;--sun:#FFC83D;--mint:#59D6B0;--pink:#FF7AB6}
html,body{margin:0;background:#000}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:"Inter Display",Inter,sans-serif}
#cam{position:absolute;inset:0;will-change:transform}
#cam video{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}
.full{position:absolute;inset:0;pointer-events:none}
#flash{background:#fff;opacity:0}
#vig{opacity:0;background:radial-gradient(ellipse at 50% 36%,rgba(22,19,31,0) 38%,rgba(22,19,31,.5) 100%)}
#desat{background:#808080;mix-blend-mode:saturation;opacity:0}
.abs{position:absolute}
.hide{visibility:hidden}
.emo{font-family:"Noto Color Emoji";line-height:1}

/* title */
#title{left:70px;top:350px;width:940px}
#title .kick{display:inline-block;background:var(--ink);color:var(--lav);font:700 28px "Inter Display";letter-spacing:.2em;padding:12px 20px;border-radius:14px}
#title .big{font:900 168px/1 "Unb";color:var(--coral);letter-spacing:-.02em;margin:14px 0 0 -6px;text-shadow:7px 7px 0 var(--ink)}
#title .row{display:flex;gap:14px;align-items:center;margin-top:18px}
#title .pill{background:var(--ink);color:var(--cream);font:800 46px "Unb";padding:12px 22px;border-radius:18px}
#title .pill b{color:var(--lav);font-weight:800}
#title .rule{background:var(--cream);color:var(--ink);font:800 30px "Inter Display";padding:14px 20px;border-radius:16px;box-shadow:5px 5px 0 var(--ink)}
#hook{left:0;width:1080px;top:1180px;display:flex;flex-direction:column;align-items:center;gap:10px}
#hook div{font:900 62px/1 "Unb";padding:16px 26px;border-radius:20px;box-shadow:7px 7px 0 var(--ink);white-space:nowrap}
#hook .l1{background:var(--cream);color:var(--ink);transform:rotate(-2deg)}
#hook .l2{background:var(--coral);color:var(--cream);transform:rotate(1.5deg)}
#prog{left:76px;top:306px;width:928px;height:10px;display:flex;gap:8px}
#prog .sg{flex:1;height:100%;border-radius:5px;background:rgba(22,19,31,.28);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.25)}
#prog .sg i{display:block;width:100%;height:100%;background:var(--cream);transform-origin:0 50%;transform:scaleX(0)}
.swipe{left:-700px;top:-200px;width:520px;height:2400px;transform:rotate(16deg);opacity:.92}
.react{font-size:92px;left:930px;top:1240px}
#cta{background:var(--sun);color:var(--ink);font:900 44px/1 "Unb";padding:16px 26px;border-radius:18px;box-shadow:6px 6px 0 var(--ink);transform:rotate(-2deg)}

/* question card + letter motif */
.card{left:250px;top:150px;transform-origin:0 0}
.card .plate{position:relative;background:var(--ink);border-radius:34px;padding:22px 200px 26px 34px;min-height:178px;box-sizing:border-box;box-shadow:0 18px 40px rgba(0,0,0,.18)}
.card .hdr{display:flex;gap:16px;align-items:center;font:700 23px "Inter Display";letter-spacing:.2em;color:var(--lav)}
.card .hdr .num{color:var(--cream);opacity:.55}
.card .name{font:800 54px/1.06 "Unb";color:var(--cream);margin-top:14px;white-space:nowrap;letter-spacing:-.01em}
.card .cox{font:italic 700 40px "Inter Display";color:var(--lav);margin-top:6px}
.tile{position:absolute;right:-26px;top:50%;width:176px;height:176px;margin-top:-88px;border-radius:36px;background:var(--coral);display:flex;align-items:center;justify-content:center;box-shadow:8px 8px 0 var(--cream),8px 8px 0 2px var(--ink)}
.tile span{font:900 112px/1 "Unb";color:var(--cream);transform:translateY(-4px)}
.tile i{position:absolute;right:16px;bottom:10px;font:900 40px/1 "Unb";color:var(--ink);font-style:normal}

/* captions: word-by-word pop, no plate */
.cap{left:60px;width:960px;top:1410px;text-align:center;font:900 70px/1.14 "Inter Display";color:#fff;letter-spacing:-.01em;
  -webkit-text-stroke:14px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 rgba(22,19,31,.35)}
.cap .w{display:inline-block;margin:0 15px;visibility:hidden;transform-origin:50% 80%}
.cap .w.hl{color:var(--sun)}

/* answer stamps (one family, per-moment variants) */
.rev{left:0;width:1080px;top:1190px;display:flex;justify-content:center;align-items:center}
.rev .stamp{display:flex;align-items:center;gap:14px;background:var(--coral);padding:18px 30px 20px 20px;border-radius:30px;box-shadow:10px 10px 0 var(--ink);transform:rotate(-3deg);position:relative;overflow:hidden}
.rev .t{flex:none;background:var(--cream);color:var(--ink);border-radius:20px;font:900 1em/1 "Unb";padding:.14em .2em .16em;min-width:.9em;text-align:center}
.rev .rest{font:900 1em/1 "Unb";color:var(--cream);white-space:nowrap;letter-spacing:-.01em}
.rev .ring{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;border:10px solid var(--coral);opacity:0}
.rev .badge{position:absolute;right:40px;top:-92px;font:900 46px/1 "Unb";padding:12px 18px;border-radius:16px;transform:rotate(5deg);box-shadow:5px 5px 0 var(--ink)}
.rev.pro .badge{background:var(--sun);color:var(--ink)}
.rev.halo .stamp{background:var(--cream)} .rev.halo .rest{color:var(--ink)} .rev.halo .t{background:var(--sun)}
.rev.gloss .stamp{background:linear-gradient(135deg,#B9A3FF,#7FE3D0)} .rev.gloss .rest{color:var(--ink)} .rev.gloss .t{background:var(--ink);color:var(--cream)}
.rev.gloss .shine{position:absolute;top:-40%;left:-60%;width:40%;height:180%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.85),rgba(255,255,255,0));transform:rotate(20deg)}
.rev.love .stamp{background:var(--pink)}
.rev.combo1 .stamp,.rev.combo2 .stamp,.rev.combo3 .stamp{background:var(--coral)}
.rev .combo{position:absolute;right:60px;top:-90px;background:var(--ink);color:var(--sun);font:900 46px/1 "Unb";padding:12px 18px;border-radius:16px;transform:rotate(4deg)}
.rev.flat .stamp{background:#9A97A3;box-shadow:none;transform:none;border-radius:8px} .rev.flat .t{background:#E6E4EA}
.rev.plain .stamp{background:#fff;box-shadow:none;transform:none;border-radius:0;padding:14px 26px;border:3px solid #111}
.rev.plain .t{background:none;font-family:Georgia,serif;font-weight:400;padding:0;min-width:0} .rev.plain .rest{color:#111;font-family:Georgia,serif;font-weight:400;letter-spacing:0}
.rev.gold .stamp{background:linear-gradient(180deg,#FFE27A,#F5B700)} .rev.gold .rest{color:var(--ink)} .rev.gold .t{background:var(--ink);color:var(--sun)}
.rev.rainbow .stamp{background:var(--ink)} .rev.rainbow .rest span{display:inline-block}

/* stickers */
.stk{transform-origin:50% 50%}
.stk .emo{filter:drop-shadow(0 0 0 #fff) drop-shadow(4px 0 0 #fff) drop-shadow(-4px 0 0 #fff) drop-shadow(0 4px 0 #fff) drop-shadow(0 -4px 0 #fff) drop-shadow(4px 6px 6px rgba(0,0,0,.25))}

/* fx */
#loading{left:190px;width:700px;top:1215px;background:var(--ink);border-radius:28px;padding:22px 28px;box-sizing:border-box;box-shadow:8px 8px 0 var(--lav)}
#loading .lt{font:900 40px/1 "Unb";color:var(--cream);display:flex;align-items:center;gap:16px}
#loading .lt .tl{width:64px;height:64px;border-radius:16px;background:var(--coral);display:flex;align-items:center;justify-content:center;font:900 42px/1 "Unb"}
#loading .bar{margin-top:18px;height:22px;border-radius:11px;background:#3a3550;overflow:hidden}
#loading .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--coral),var(--sun));transform-origin:0 50%;transform:scaleX(0)}
#halo{left:450px;top:330px;width:300px;height:70px;border-radius:50%;border:16px solid #FFE27A;box-sizing:border-box;box-shadow:0 0 30px 8px rgba(255,226,122,.75),inset 0 0 18px rgba(255,226,122,.8)}
#gloss{left:-500px;top:0;width:360px;height:1920px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.45),rgba(255,255,255,0));transform:rotate(18deg);transform-origin:50% 50%}
#freeze{left:0;width:1080px;top:1200px;display:flex;justify-content:center;align-items:center;gap:28px}
#freeze .tl{width:190px;height:190px;border-radius:40px;display:flex;align-items:center;justify-content:center;font:900 120px/1 "Unb";box-shadow:9px 9px 0 var(--ink)}
#freeze .neq{font:900 120px/1 "Inter Display";color:var(--cream);text-shadow:6px 6px 0 var(--ink)}
#freeze .x{position:absolute;font:900 54px/1 "Unb";color:var(--cream);background:var(--coral);padding:10px 18px;border-radius:14px;top:-80px;transform:rotate(-6deg);box-shadow:5px 5px 0 var(--ink)}
.heart{font-size:90px}
#combo{left:0;width:1080px;top:1000px;text-align:center;font:900 120px/1 "Unb";color:var(--sun);text-shadow:7px 7px 0 var(--ink),-2px -2px 0 var(--ink)}
.star{font-size:80px}
.conf{width:64px;height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;font:900 40px/1 "Unb";color:var(--cream);box-shadow:4px 4px 0 var(--ink)}
#later{left:56px;top:430px;background:var(--sun);color:var(--ink);font:900 40px/1 "Unb";padding:16px 22px;border-radius:18px;box-shadow:6px 6px 0 var(--ink);transform:rotate(-2deg)}
#endcard{left:0;width:1080px;top:1130px;display:flex;flex-direction:column;align-items:center;gap:16px}
#endcard .big{font:900 150px/1 "Unb";color:var(--coral);text-shadow:7px 7px 0 var(--ink)}
#endcard .pill{background:var(--ink);color:var(--cream);font:800 46px "Unb";padding:12px 24px;border-radius:18px}
#endcard .pill b{color:var(--lav)}
#logos{position:absolute;inset:0;width:1080px;height:1920px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.45))}
#endshade{background:linear-gradient(to bottom,rgba(22,19,31,0) 45%,rgba(22,19,31,.6) 78%)}
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="1080" data-height="1920" data-start="0" data-duration="__T__">
  <div id="cam"><video id="v" class="clip" src="base.mp4" data-start="0" data-duration="__T__" muted playsinline></video></div>
  <div id="desat" class="full"></div>
  <div id="vig" class="full"></div>
  <div id="endshade" class="full hide"></div>
  <div id="layer"></div>
  <img id="logos" src="logos.png" alt="">
  <div id="flash" class="full"></div>
</div>
<script src="gsap.min.js"></script>
<script>
const D = __DATA__;
const L = document.getElementById('layer');
const tl = gsap.timeline({paused:true});
const el = (html) => { const d=document.createElement('div'); d.innerHTML=html.trim(); const n=d.firstChild; L.appendChild(n); return n; };
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const show = (n,t) => tl.set(n,{visibility:'visible'},t);
const hide = (n,t) => tl.set(n,{visibility:'hidden'},t);
tl.set('#flash',{opacity:0},0); tl.set('#desat',{opacity:0},0); tl.set('#endshade',{opacity:0},0);
const flash = (t,o=.8) => { tl.set('#flash',{opacity:o},t); tl.to('#flash',{opacity:0,duration:.18,ease:'power2.out'},t+0.01); };

/* ---------- reframing (relative punch-ins around the face) ---------- */
tl.set('#cam',{transformOrigin:`${D.FX}px ${D.FY}px`},0);
D.zooms.forEach(z => { if (z.d>0) tl.to('#cam',{scale:z.s,duration:z.d,ease:'sine.inOut'},z.t); else tl.set('#cam',{scale:z.s},z.t); });

/* ---------- cold-open label + title smash ---------- */
const hk = el(`<div id="hook" class="abs hide"><div class="l1">HISS MƏŞHURLARI</div><div class="l2">BİR SÖZLƏ TƏSVİR EDİR <span class="emo">👀</span></div></div>`);
show(hk,D.fx.hook.a);
tl.fromTo(hk.querySelector('.l1'),{scale:2.4,opacity:0},{scale:1,opacity:1,duration:.18,ease:'power4.in'},D.fx.hook.a);
tl.fromTo(hk.querySelector('.l2'),{scale:2.4,opacity:0},{scale:1,opacity:1,duration:.18,ease:'power4.in'},D.fx.hook.a+0.16);
tl.fromTo(hk,{y:0},{y:8,duration:.06,yoyo:true,repeat:1},D.fx.hook.a+0.34);
tl.to(hk,{y:40,opacity:0,duration:.18,ease:'power2.in'},D.fx.hook.b-0.18); hide(hk,D.fx.hook.b);
/* story-style round progress */
const pg = el(`<div id="prog" class="abs">${D.fx.rounds.map(()=>'<div class="sg"><i></i></div>').join('')}</div>`);
pg.querySelectorAll('.sg i').forEach((b,i)=>{ const [a,e]=D.fx.rounds[i]; tl.set(b,{scaleX:0},0); tl.to(b,{scaleX:1,duration:Math.max(.2,e-a),ease:'none'},a); });
/* swipe on every new round */
const SWC=['#FF4F2E','#C7B5FF','#FFC83D','#59D6B0'];
D.fx.swipes.forEach((t0,i)=>{ const sw=el(`<div class="swipe abs hide" style="background:${SWC[i%4]}"></div>`);
  show(sw,t0); tl.fromTo(sw,{x:0},{x:2300,duration:.3,ease:'power2.inOut'},t0); hide(sw,t0+0.31); });
/* floating reactions */
D.fx.reacts.forEach(([t0,e,n])=>{ for(let k=0;k<n;k++){ const r=el(`<div class="react abs hide emo">${e}</div>`); const st=t0+k*0.11, dx=((k*37)%90)-45;
  show(r,st); tl.fromTo(r,{y:0,x:0,scale:.4,opacity:0},{y:-520-((k*53)%160),x:dx,scale:1,opacity:1,duration:1.15,ease:'power1.out'},st);
  tl.to(r,{opacity:0,duration:.3},st+0.85); hide(r,st+1.2);} });
flash(D.fx.smash,.9);
tl.fromTo('#cam',{x:0},{x:14,duration:.04,yoyo:true,repeat:5,ease:'none'},D.fx.smash);
const title = el(`<div id="title" class="abs hide"><div class="kick">SÖZ OYUNU</div><div class="big">HISS</div>
  <div class="row"><div class="pill">«… <b>ÇOX</b> ?»</div><div class="rule">ad + hərf → bir söz</div></div></div>`);
show(title,D.fx.title.a);
tl.fromTo(title.querySelector('.big'),{scale:2.2,opacity:0,transformOrigin:'0% 70%'},{scale:1,opacity:1,duration:.22,ease:'power4.in'},D.fx.title.a);
tl.fromTo(title.querySelector('.kick'),{y:-30,opacity:0},{y:0,opacity:1,duration:.25,ease:'power3.out'},D.fx.title.a+0.15);
tl.fromTo(title.querySelectorAll('.row > div'),{y:40,opacity:0},{y:0,opacity:1,duration:.28,stagger:.08,ease:'power3.out'},D.fx.title.a+0.25);
tl.to(title,{y:-40,opacity:0,duration:.25,ease:'power2.in'},D.fx.title.b-0.25); hide(title,D.fx.title.b);

/* ---------- question cards: the letter tile is the recurring character ---------- */
D.cards.forEach(c => {
  const n = el(`<div class="card abs hide"><div class="plate">
     <div class="hdr"><span>HISS · «ÇOX…»</span><span class="num">${String(c.i).padStart(2,'0')} / ${String(c.n).padStart(2,'0')}</span></div>
     <div class="name">${esc(c.name)}</div><div class="cox">çox …</div>
     <div class="tile"><span>${c.letter}</span><i>…</i></div></div></div>`);
  const nm=n.querySelector('.name'); if (c.name.length>12) nm.style.fontSize=Math.round(54*12.5/c.name.length)+'px';
  const plate=n.querySelector('.plate'), tile=n.querySelector('.tile'), let_=tile.querySelector('span');
  show(n,c.t_in); tl.set(n,{scale:.66},c.t_in);
  tl.fromTo(plate,{y:-60,opacity:0},{y:0,opacity:1,duration:.3,ease:'back.out(1.8)'},c.t_in);
  tl.fromTo(tile,{scale:0,rotation:-25},{scale:1,rotation:0,duration:.3,ease:'back.out(2.4)'},c.t_in+0.08);
  tl.set(let_,{opacity:0},c.t_in);
  tl.fromTo(tile,{rotationY:90},{rotationY:0,duration:.22,ease:'power2.out'},c.t_letter-0.05);
  tl.set(let_,{opacity:1},c.t_letter-0.05);
  tl.fromTo(let_,{scale:1.6},{scale:1,duration:.25,ease:'back.out(3)'},c.t_letter-0.05);
  const tb = Math.min(c.t_letter+1.0, c.t_end-0.3);
  tl.to(n,{scale:.5,duration:.32,ease:'power3.inOut'},tb);
  tl.to(n.querySelector('.cox'),{opacity:0,duration:.2},tb);
  // impatient tile: taps while she thinks (until the round's first reveal)
  const firstRev = D.revs.find(r => r.a>=c.t_in && r.a<c.t_end);
  const thinkEnd = firstRev ? firstRev.a-0.1 : c.t_end-0.5;
  for (let t=tb+0.8; t<thinkEnd-0.4; t+=1.3) tl.fromTo(tile,{rotation:0},{rotation:8,duration:.09,yoyo:true,repeat:3,ease:'sine.inOut'},t);
  tl.to(n,{y:-60,opacity:0,duration:.25,ease:'power2.in'},c.t_end-0.25); hide(n,c.t_end);
  c._tile=tile;
});
const cardAt = t => D.cards.find(c => t>=c.t_in && t<c.t_end);

/* ---------- captions: each word pops as it is spoken ---------- */
D.caps.forEach(c => {
  const ws=c.text.split(' ');
  const n = el(`<div class="cap abs">${ws.map(w=>`<span class="w${c.hl.includes(w)?' hl':''}">${esc(w)}</span>`).join('')}</div>`);
  n.querySelectorAll('.w').forEach((s,i)=>{ const t0=c.wt[i];
    tl.set(s,{visibility:'visible'},t0);
    tl.fromTo(s,{scale:1.45,y:10},{scale:1,y:0,duration:.14,ease:'back.out(2.5)'},t0);
    tl.set(s,{visibility:'hidden'},c.b); });
});

/* ---------- answer stamps (variants per moment) ---------- */
const RAIN=['#FF4F2E','#FFC83D','#59D6B0','#C7B5FF','#FF7AB6','#FFF4E6'];
D.revs.forEach(r => {
  const first=r.word[0], rest=r.word.slice(1);
  const fs=Math.min(112, Math.round(840/(r.word.length*0.98+0.9)));
  let restHtml=esc(rest);
  if (r.style==='rainbow') restHtml=[...rest].map((ch,i)=>`<span style="color:${RAIN[i%RAIN.length]}">${esc(ch)}</span>`).join('');
  let extra='';
  if (r.style==='pro') extra=`<div class="badge">PRO ★</div>`;
  if (r.style.startsWith('combo')) extra=`<div class="combo">Ə ×${r.style.slice(-1)}</div>`;
  const n = el(`<div class="rev abs hide ${r.style}"><div class="ring"></div><div style="position:relative">${extra}<div class="stamp" style="font-size:${fs}px">${r.style==='gloss'?'<div class="shine"></div>':''}<span class="t">${esc(first)}</span><span class="rest">${restHtml}</span></div></div></div>`);
  const st=n.querySelector('.stamp'), t1=n.querySelector('.t');
  show(n,r.a);
  if (r.style==='flat') {            // deadpan: no bounce, slow slide, no ring
    tl.fromTo(st,{x:-80,opacity:0},{x:0,opacity:1,duration:.7,ease:'none'},r.a);
  } else if (r.style==='plain') {    // "sadə": deliberately plain, just appears
    tl.fromTo(st,{opacity:0},{opacity:1,duration:.05},r.a);
  } else {
    tl.fromTo(st,{scale:1.9,opacity:0,rotation:-9},{scale:1,opacity:1,rotation:-3,duration:.17,ease:'power4.in'},r.a);
    tl.fromTo(st,{y:0},{y:6,duration:.06,yoyo:true,repeat:1,ease:'sine.inOut'},r.a+0.15);
    tl.fromTo(n.querySelector('.ring'),{scale:.3,opacity:.9},{scale:2.2,opacity:0,duration:.45,ease:'power2.out'},r.a+0.13);
    // letter motif: the initial tile drops in on top of the word
    tl.fromTo(t1,{y:-220,rotation:-30},{y:0,rotation:0,duration:.32,ease:'bounce.out'},r.a+0.02);
  }
  if (r.style==='pro') tl.fromTo(n.querySelector('.badge'),{scale:0,rotation:-40},{scale:1,rotation:5,duration:.3,ease:'back.out(3)'},r.a+0.2);
  if (r.style.startsWith('combo')) tl.fromTo(n.querySelector('.combo'),{scale:0,rotation:-30},{scale:1,rotation:4,duration:.25,ease:'back.out(3)'},r.a+0.12);
  if (r.style==='gloss') tl.fromTo(n.querySelector('.shine'),{x:0},{x:1400,duration:.6,ease:'power2.inOut'},r.a+0.2);
  if (r.style==='rainbow') { const sp=n.querySelectorAll('.rest span');
    tl.fromTo(sp,{y:30,opacity:0},{y:0,opacity:1,duration:.18,stagger:.03,ease:'back.out(3)'},r.a+0.05);
    tl.to(sp,{y:-10,duration:.18,stagger:{each:.04,yoyo:true,repeat:1},ease:'sine.inOut'},r.a+0.5);
    tl.fromTo(st,{scale:1.12},{scale:1,duration:.25,ease:'back.out(3)'},D.fx.final_pulse); }
  const c=cardAt(r.a);
  if (c && c._tile) { tl.to(c._tile,{backgroundColor:r.style==='flat'?'#9A97A3':'#59D6B0',duration:.12},r.a);
    tl.fromTo(c._tile,{scale:1.3,rotation:-12},{scale:1,rotation:0,duration:.35,ease:'back.out(3)'},r.a); }
  tl.to(n,{opacity:0,y:-14,duration:.12,ease:'power2.in'},r.b-0.12); hide(n,r.b);

/* ---------- emoji stickers (beside the head) ---------- */
D.stickers.forEach(s => {
  const n = el(`<div class="stk abs hide" style="left:${s.x-s.s/2}px;top:${s.y-s.s/2}px;width:${s.s}px;height:${s.s}px"><div class="emo" style="font-size:${Math.round(s.s*0.82)}px;text-align:center">${s.e}</div></div>`);

  if (s.anim==='none') tl.fromTo(n,{opacity:0},{opacity:1,duration:.25},s.a);
  else tl.fromTo(n,{scale:0,rotation:s.rot-40},{scale:1,rotation:s.rot,duration:.3,ease:'back.out(3)'},s.a);
  const dur=s.b-s.a-0.4;

  if (s.anim==='shake' && dur>0) tl.to(n,{rotation:s.rot+12,duration:.07,yoyo:true,repeat:Math.max(1,Math.floor(dur/.07/2)*2-1),ease:'none'},s.a+0.3);

  if (s.anim==='clap' && dur>0) tl.to(n,{scale:1.18,duration:.12,yoyo:true,repeat:Math.max(1,Math.floor(dur/.12/2)*2-1),ease:'sine.inOut'},s.a+0.3);
  tl.to(n,{scale:0,opacity:0,duration:.14,ease:'power2.in'},s.b-0.14); hide(n,s.b);
});

/* ---------- loading bar during Ayaz pause ---------- */

/* ---------- halo for "dürüst" ---------- */
const H=D.fx.halo; const halo=el(`<div id="halo" class="abs hide"></div>`);
show(halo,H.a); tl.fromTo(halo,{y:-140,opacity:0,scale:.6},{y:0,opacity:1,scale:1,duration:.4,ease:'back.out(2)'},H.a);
tl.to(halo,{y:-10,duration:.4,yoyo:true,repeat:Math.max(1,Math.floor((H.b-H.a-.5)/.4)),ease:'sine.inOut'},H.a+0.4);
tl.to(halo,{opacity:0,duration:.15},H.b-0.15); hide(halo,H.b);

/* ---------- "flawless" gloss sweep ---------- */
const gl=el(`<div id="gloss" class="abs hide"></div>`); show(gl,D.fx.gloss);
tl.fromTo(gl,{x:0},{x:2100,duration:.55,ease:'power2.inOut'},D.fx.gloss); hide(gl,D.fx.gloss+0.6);

/* ---------- freeze: Q ≠ G ---------- */
const F=D.fx.freeze; flash(F.a,.85);
tl.to('#vig',{opacity:1,duration:.15},F.a); tl.to('#vig',{opacity:0,duration:.12},F.b-0.1);
const fz=el(`<div id="freeze" class="abs hide"><div class="x">YANLIŞ HƏRF!</div><div class="tl" style="background:#C7B5FF;color:#16131F">Q</div><div class="neq">≠</div><div class="tl" style="background:#FF4F2E;color:#FFF4E6">G</div></div>`);

tl.fromTo(ft[0],{x:-300,rotation:-30,opacity:0},{x:0,rotation:-6,opacity:1,duration:.22,ease:'back.out(2)'},F.a+0.06);

/* ---------- hearts for "gözəldir" ---------- */
const HT=D.fx.hearts;
[[780,620],[880,700],[700,520],[930,560],[820,460]].forEach(([x,y],i)=>{

const CB=D.fx.combo; const cb=el(`<div id="combo" class="abs hide">COMBO!</div>`);

for (let i=0;i<10;i++){ const x=(i%2? 880+((i*53)%120) : 30+((i*61)%140)), col=RAIN[i%5];

  show(c,CA+i*0.03); tl.fromTo(c,{y:0,rotation:0},{y:600+((i*71)%400),rotation:(i%2?1:-1)*(200+i*20),duration:1.6,ease:'power1.in'},CA+i*0.03);

const E=D.fx.end; show('#endshade',E.a); tl.to('#endshade',{opacity:1,duration:.4},E.a+0.1);

tl.fromTo(ec.querySelector('.big'),{scale:.6,opacity:0},{scale:1,opacity:1,duration:.35,ease:'back.out(2.2)'},E.a+0.35);

tl.fromTo('#cta',{scale:0,rotation:-14,opacity:0},{scale:1,rotation:-2,opacity:1,duration:.3,ease:'back.out(2.6)'},E.a+0.85);
tl.to('#cta',{scale:1.07,duration:.3,yoyo:true,repeat:3,ease:'sine.inOut'},E.a+1.2);

tl.set({}, {}, D.T);
window.__timelines = {root: tl};
