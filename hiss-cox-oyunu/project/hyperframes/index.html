:root{--ink:#16131F;--cream:#FFF4E6;--coral:#FF4F2E;--lav:#C7B5FF;--sun:#FFC83D;--mint:#59D6B0;--pink:#FF7AB6}
html,body{margin:0;background:#000}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:"Inter Display",Inter,sans-serif}
#cam{position:absolute;inset:0;will-change:transform}
#cam video{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}
.full{position:absolute;inset:0;pointer-events:none}
#flash{background:#fff;opacity:0}
#vig{opacity:0;background:radial-gradient(ellipse at 50% 36%,rgba(22,19,31,0) 38%,rgba(22,19,31,.5) 100%)}
#desat{background:#808080;mix-blend-mode:saturation;opacity:0}
.abs{position:absolute}
.hide{visibility:hidden}
.emo{font-family:"Noto Color Emoji";line-height:1}

/* title */
#title{left:70px;top:330px;width:940px}
#title .kick{display:inline-block;background:var(--ink);color:var(--lav);font:700 28px "Inter Display";letter-spacing:.2em;padding:12px 20px;border-radius:14px}
#title .big{font:900 168px/1 "Unb";color:var(--coral);letter-spacing:-.02em;margin:14px 0 0 -6px;text-shadow:7px 7px 0 var(--ink)}
#title .row{display:flex;gap:14px;align-items:center;margin-top:18px}
#title .pill{background:var(--ink);color:var(--cream);font:800 46px "Unb";padding:12px 22px;border-radius:18px}
#title .pill b{color:var(--lav);font-weight:800}
#title .rule{background:var(--cream);color:var(--ink);font:800 30px "Inter Display";padding:14px 20px;border-radius:16px;box-shadow:5px 5px 0 var(--ink)}
#hooklbl{left:262px;top:178px;background:var(--sun);color:var(--ink);font:900 34px/1 "Unb";padding:14px 20px;border-radius:16px;box-shadow:6px 6px 0 var(--ink);transform:rotate(-3deg)}

/* question card + letter motif */
.card{left:250px;top:150px;transform-origin:0 0}
.card .plate{position:relative;background:var(--ink);border-radius:34px;padding:22px 200px 26px 34px;min-height:178px;box-sizing:border-box;box-shadow:0 18px 40px rgba(0,0,0,.18)}
.card .hdr{display:flex;gap:16px;align-items:center;font:700 23px "Inter Display";letter-spacing:.2em;color:var(--lav)}
.card .hdr .num{color:var(--cream);opacity:.55}
.card .name{font:800 54px/1.06 "Unb";color:var(--cream);margin-top:14px;white-space:nowrap;letter-spacing:-.01em}
.card .cox{font:italic 700 40px "Inter Display";color:var(--lav);margin-top:6px}
.tile{position:absolute;right:-26px;top:50%;width:176px;height:176px;margin-top:-88px;border-radius:36px;background:var(--coral);display:flex;align-items:center;justify-content:center;box-shadow:8px 8px 0 var(--cream),8px 8px 0 2px var(--ink)}
.tile span{font:900 112px/1 "Unb";color:var(--cream);transform:translateY(-4px)}
.tile i{position:absolute;right:16px;bottom:10px;font:900 40px/1 "Unb";color:var(--ink);font-style:normal}

/* captions */
.cap{left:90px;width:900px;top:1425px;display:flex;justify-content:center}
.cap .box{background:rgba(22,19,31,.86);color:var(--cream);font:800 60px/1.16 "Inter Display";padding:14px 28px 18px;border-radius:24px;text-align:center;max-width:900px;box-sizing:border-box}
.cap .hl{background:var(--coral);color:var(--cream);border-radius:12px;padding:0 10px;display:inline-block}
.cap .w{display:inline-block}

/* answer stamps (one family, per-moment variants) */
.rev{left:0;width:1080px;top:1190px;display:flex;justify-content:center;align-items:center}
.rev .stamp{display:flex;align-items:center;gap:14px;background:var(--coral);padding:18px 30px 20px 20px;border-radius:30px;box-shadow:10px 10px 0 var(--ink);transform:rotate(-3deg);position:relative;overflow:hidden}
.rev .t{flex:none;background:var(--cream);color:var(--ink);border-radius:20px;font:900 1em/1 "Unb";padding:.14em .2em .16em;min-width:.9em;text-align:center}
.rev .rest{font:900 1em/1 "Unb";color:var(--cream);white-space:nowrap;letter-spacing:-.01em}
.rev .ring{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;border:10px solid var(--coral);opacity:0}
.rev .badge{position:absolute;right:40px;top:-92px;font:900 46px/1 "Unb";padding:12px 18px;border-radius:16px;transform:rotate(5deg);box-shadow:5px 5px 0 var(--ink)}
.rev.pro .badge{background:var(--sun);color:var(--ink)}
.rev.halo .stamp{background:var(--cream)} .rev.halo .rest{color:var(--ink)} .rev.halo .t{background:var(--sun)}
.rev.gloss .stamp{background:linear-gradient(135deg,#B9A3FF,#7FE3D0)} .rev.gloss .rest{color:var(--ink)} .rev.gloss .t{background:var(--ink);color:var(--cream)}
.rev.gloss .shine{position:absolute;top:-40%;left:-60%;width:40%;height:180%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.85),rgba(255,255,255,0));transform:rotate(20deg)}
.rev.love .stamp{background:var(--pink)}
.rev.combo1 .stamp,.rev.combo2 .stamp,.rev.combo3 .stamp{background:var(--coral)}
.rev .combo{position:absolute;right:60px;top:-90px;background:var(--ink);color:var(--sun);font:900 46px/1 "Unb";padding:12px 18px;border-radius:16px;transform:rotate(4deg)}
.rev.flat .stamp{background:#9A97A3;box-shadow:none;transform:none;border-radius:8px} .rev.flat .t{background:#E6E4EA}
.rev.plain .stamp{background:#fff;box-shadow:none;transform:none;border-radius:0;padding:14px 26px;border:3px solid #111}
.rev.plain .t{background:none;font-family:Georgia,serif;font-weight:400;padding:0;min-width:0} .rev.plain .rest{color:#111;font-family:Georgia,serif;font-weight:400;letter-spacing:0}
.rev.gold .stamp{background:linear-gradient(180deg,#FFE27A,#F5B700)} .rev.gold .rest{color:var(--ink)} .rev.gold .t{background:var(--ink);color:var(--sun)}
.rev.rainbow .stamp{background:var(--ink)} .rev.rainbow .rest span{display:inline-block}

.stk{transform-origin:50% 50%}

#loading .lt .tl{width:64px;height:64px;border-radius:16px;background:var(--coral);display:flex;align-items:center;justify-content:center;font:900 42px/1 "Unb"}
#loading .bar{margin-top:18px;height:22px;border-radius:11px;background:#3a3550;overflow:hidden}
#loading .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--coral),var(--sun));transform-origin:0 50%;transform:scaleX(0)}
#halo{left:450px;top:330px;width:300px;height:70px;border-radius:50%;border:16px solid #FFE27A;box-sizing:border-box;box-shadow:0 0 30px 8px rgba(255,226,122,.75),inset 0 0 18px rgba(255,226,122,.8)}
#gloss{left:-500px;top:0;width:360px;height:1920px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.45),rgba(255,255,255,0));transform:rotate(18deg);transform-origin:50% 50%}
#freeze{left:0;width:1080px;top:1200px;display:flex;justify-content:center;align-items:center;gap:28px}

#freeze .x{position:absolute;font:900 54px/1 "Unb";color:var(--cream);background:var(--coral);padding:10px 18px;border-radius:14px;top:-80px;transform:rotate(-6deg);box-shadow:5px 5px 0 var(--ink)}
.heart{font-size:90px}
#combo{left:0;width:1080px;top:1000px;text-align:center;font:900 120px/1 "Unb";color:var(--sun);text-shadow:7px 7px 0 var(--ink),-2px -2px 0 var(--ink)}
.star{font-size:80px}
.conf{width:64px;height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;font:900 40px/1 "Unb";color:var(--cream);box-shadow:4px 4px 0 var(--ink)}
#later{left:56px;top:430px;background:var(--sun);color:var(--ink);font:900 40px/1 "Unb";padding:16px 22px;border-radius:18px;box-shadow:6px 6px 0 var(--ink);transform:rotate(-2deg)}
#endcard{left:0;width:1080px;top:1130px;display:flex;flex-direction:column;align-items:center;gap:16px}
#endcard .big{font:900 150px/1 "Unb";color:var(--coral);text-shadow:7px 7px 0 var(--ink)}
#endcard .pill{background:var(--ink);color:var(--cream);font:800 46px "Unb";padding:12px 24px;border-radius:18px}
#endcard .pill b{color:var(--lav)}
#logos{position:absolute;inset:0;width:1080px;height:1920px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.45))}
#endshade{background:linear-gradient(to bottom,rgba(22,19,31,0) 45%,rgba(22,19,31,.6) 78%)}

D.revs.forEach(r => {
  const first=r.word[0], rest=r.word.slice(1);
  const fs=Math.min(112, Math.round(840/(r.word.length*0.98+0.9)));
  let restHtml=esc(rest);
  if (r.style==='rainbow') restHtml=[...rest].map((ch,i)=>`<span style="color:${RAIN[i%RAIN.length]}">${esc(ch)}</span>`).join('');
  let extra='';
  if (r.style==='pro') extra=`<div class="badge">PRO ★</div>`;
  if (r.style.startsWith('combo')) extra=`<div class="combo">Ə ×${r.style.slice(-1)}</div>`;
  const n = el(`<div class="rev abs hide ${r.style}"><div class="ring"></div><div style="position:relative">${extra}<div class="stamp" style="font-size:${fs}px">${r.style==='gloss'?'<div class="shine"></div>':''}<span class="t">${esc(first)}</span><span class="rest">${restHtml}</span></div></div></div>`);
  const st=n.querySelector('.stamp'), t1=n.querySelector('.t');
  show(n,r.a);
  if (r.style==='flat') {            // deadpan: no bounce, slow slide, no ring
    tl.fromTo(st,{x:-80,opacity:0},{x:0,opacity:1,duration:.7,ease:'none'},r.a);
  } else if (r.style==='plain') {    // "sadə": deliberately plain, just appears

  } else {

  if (r.style==='pro') tl.fromTo(n.querySelector('.badge'),{scale:0,rotation:-40},{scale:1,rotation:5,duration:.3,ease:'back.out(3)'},r.a+0.2);

const F=D.fx.freeze; flash(F.a,.85);
tl.to('#vig',{opacity:1,duration:.15},F.a); tl.to('#vig',{opacity:0,duration:.12},F.b-0.1);
const fz=el(`<div id="freeze" class="abs hide"><div class="x">YANLIŞ HƏRF!</div><div class="tl" style="background:#C7B5FF;color:#16131F">Q</div><div class="neq">≠</div><div class="tl" style="background:#FF4F2E;color:#FFF4E6">G</div></div>`);
show(fz,F.a+0.06); const ft=fz.querySelectorAll('.tl');
tl.fromTo(ft[0],{x:-300,rotation:-30,opacity:0},{x:0,rotation:-6,opacity:1,duration:.22,ease:'back.out(2)'},F.a+0.06);
tl.fromTo(ft[1],{x:300,rotation:30,opacity:0},{x:0,rotation:6,opacity:1,duration:.22,ease:'back.out(2)'},F.a+0.14);
tl.fromTo(fz.querySelector('.neq'),{scale:0},{scale:1,duration:.2,ease:'back.out(3)'},F.a+0.28);
tl.fromTo(fz.querySelector('.x'),{scale:0,rotation:-30},{scale:1,rotation:-6,duration:.22,ease:'back.out(3)'},F.a+0.36);
tl.to(fz,{opacity:0,duration:.08},F.b-0.08); hide(fz,F.b);

/* ---------- hearts for "gözəldir" ---------- */
const HT=D.fx.hearts;
[[780,620],[880,700],[700,520],[930,560],[820,460]].forEach(([x,y],i)=>{
  const h=el(`<div class="abs hide emo heart" style="left:${x}px;top:${y}px">💕</div>`); const t=HT.a+i*0.12;
  show(h,t); tl.fromTo(h,{y:60,scale:.3,opacity:0},{y:-220,scale:1,opacity:1,duration:1.1,ease:'power1.out'},t);
  tl.to(h,{opacity:0,duration:.25},t+0.9); hide(h,t+1.2);
});

/* ---------- combo banner ---------- */
const CB=D.fx.combo; const cb=el(`<div id="combo" class="abs hide">COMBO!</div>`);
show(cb,CB.a); tl.fromTo(cb,{scale:3,opacity:0,rotation:-8},{scale:1,opacity:1,rotation:-4,duration:.22,ease:'power4.in'},CB.a);
tl.fromTo(cb,{x:0},{x:10,duration:.05,yoyo:true,repeat:5,ease:'none'},CB.a+0.22);
tl.to(cb,{opacity:0,duration:.12},CB.b-0.12); hide(cb,CB.b);

/* ---------- deadpan: colour drains for "laqeyddir" ---------- */
const DP=D.fx.deadpan; tl.to('#desat',{opacity:.75,duration:.5,ease:'none'},DP.a); tl.to('#desat',{opacity:0,duration:.15},DP.b-0.15);

/* ---------- stars for "istedadlıdır" ---------- */
const SA=D.fx.stars.a;
[[180,380,-260,-200],[880,360,240,-220],[120,820,-280,60],[960,800,260,40],[540,260,0,-260],[300,1080,-220,180],[800,1060,220,170]].forEach(([x,y,dx,dy],i)=>{
  const s=el(`<div class="abs hide emo star" style="left:${x}px;top:${y}px">⭐</div>`);
  show(s,SA); tl.fromTo(s,{x:0,y:0,scale:.2,opacity:1,rotation:0},{x:dx*.5,y:dy*.5,scale:1,rotation:180,duration:.7,ease:'power3.out'},SA+i*0.02);
  tl.to(s,{opacity:0,duration:.25},SA+0.75); hide(s,SA+1.0);
});

/* ---------- "+10 SANİYƏ" chip ---------- */
const LA=D.fx.later; const la=el(`<div id="later" class="abs hide">${LA.text}</div>`);
show(la,LA.a); tl.fromTo(la,{scale:0,rotation:-20},{scale:1,rotation:-2,duration:.25,ease:'back.out(2.6)'},LA.a);
tl.to(la,{opacity:0,y:-10,duration:.15},LA.b-0.15); hide(la,LA.b);

/* ---------- confetti of R tiles for the finale ---------- */
const CA=D.fx.confetti.a;
for (let i=0;i<10;i++){ const x=(i%2? 880+((i*53)%120) : 30+((i*61)%140)), col=RAIN[i%5];
  const c=el(`<div class="abs hide conf" style="left:${x}px;top:320px;background:${col}">${i%3? 'R':'Ə'}</div>`);
  show(c,CA+i*0.03); tl.fromTo(c,{y:0,rotation:0},{y:600+((i*71)%400),rotation:(i%2?1:-1)*(200+i*20),duration:1.6,ease:'power1.in'},CA+i*0.03);
  tl.to(c,{opacity:0,duration:.3},CA+i*0.03+1.3); hide(c,CA+i*0.03+1.65); }

/* ---------- end card ---------- */
const E=D.fx.end; show('#endshade',E.a); tl.to('#endshade',{opacity:1,duration:.4},E.a+0.1);
const ec=el(`<div id="endcard" class="abs hide"><div class="big">HISS</div><div class="pill">«… <b>ÇOX</b> ?»</div></div>`);
show(ec,E.a+0.35);
tl.fromTo(ec.querySelector('.big'),{scale:.6,opacity:0},{scale:1,opacity:1,duration:.35,ease:'back.out(2.2)'},E.a+0.35);
tl.fromTo(ec.querySelector('.pill'),{y:30,opacity:0},{y:0,opacity:1,duration:.3,ease:'power3.out'},E.a+0.5);

tl.set({}, {}, D.T);
window.__timelines = {root: tl};
</script>
</body>
