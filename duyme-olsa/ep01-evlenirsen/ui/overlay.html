<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<title>Düymə olsa · Ep01 · UI layer</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<div id="stage">
  <!-- 3D plate (set per frame by compose.js); the UI below is fully editable HTML -->
  <img id="bg" alt="">
  <div id="vignette"></div>

  <!-- Card 1: Xala asks → buttons → collapses into the muted pill -->
  <div id="ask" class="glass">
    <div id="askContent" class="pad">
      <div class="head"><div class="appicon">
        <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H11l-4.6 3.6c-.5.4-1.2 0-1.2-.6V16h0A2.5 2.5 0 0 1 4 13.5z" fill="#fff"/></svg>
        </div><span data-text="ask.app"></span><span class="spacer"></span><span class="time" data-text="ask.time"></span></div>
      <div class="sender"><div class="avatar xala" data-initial="ask.sender"></div><div class="name" data-text="ask.sender"></div></div>
      <div class="msg" data-text="ask.text"></div>
      <div id="buttonsWrap">
        <div class="buttons">
          <div class="btn secondary" id="btnSecondary" data-text="buttons.secondary"></div>
          <div class="btn primary" id="btnPrimary">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" fill="#fff" stroke="none"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
            <span data-text="buttons.primary"></span>
          </div>
        </div>
      </div>
    </div>
    <div id="pillContent" class="pill" style="position:absolute;left:0;bottom:0;opacity:0">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8.5a6 6 0 0 0-10.3-4.2M6 8.5c0 6-2.5 7.5-2.5 7.5h13"/><path d="M10.3 20a2 2 0 0 0 3.4 0"/><path d="M3 3l18 18"/></svg></div>
      <div class="label" data-text="muted.text"></div>
    </div>
  </div>
  <div id="tap"></div>

  <!-- Card 2: family group chat -->
  <div id="group" class="glass">
    <div id="groupContent" class="pad">
      <div class="head"><div class="appicon">
        <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H11l-4.6 3.6c-.5.4-1.2 0-1.2-.6V16h0A2.5 2.5 0 0 1 4 13.5z" fill="#fff"/></svg>
        </div><span data-text="ask.app"></span><span class="spacer"></span><span class="time" data-text="group.time"></span></div>
      <div class="sender"><div class="avatar group">
        <svg viewBox="0 0 24 24" fill="#fff"><circle cx="9" cy="8.5" r="3.3"/><circle cx="16.5" cy="9.5" r="2.6" opacity=".8"/>
          <path d="M2.8 19c.6-3.4 3.2-5.3 6.2-5.3s5.6 1.9 6.2 5.3z"/><path d="M15.3 13.6c2.7-.3 5 1.3 5.8 4.6h-4.7c-.2-1.7-.6-3.3-1.1-4.6z" opacity=".8"/></svg></div>
        <div class="name"><span data-text="group.chat"></span> <span class="dim">· <span data-text="group.sender"></span></span></div></div>
      <div class="attach"><div class="tile">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.5 11.5l-8.3 8.3a5 5 0 0 1-7-7l8.6-8.6a3.4 3.4 0 0 1 4.8 4.8l-8.4 8.4a1.7 1.7 0 0 1-2.4-2.4l7.7-7.7"/></svg></div>
        <div class="label" data-text="group.attachment"></div></div>
      <div class="msg small" data-text="group.text"></div>
      <div class="follow" id="follow"><div class="who" data-text="group.sender"></div><div class="msg small" data-text="group.followup"></div></div>
    </div>
  </div>
</div>
<script src="overlay.js"></script>
</body>
</html>
