<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<title>Zəfərin görünməyən qəhrəmanları</title>
<style>
  :root{
    --ink:#f3efe6;        /* warm off-white, like printed documentary titles */
    --muted:#c9c3b6;
    --red:#c8323c;        /* flag red, toned down */
    --bg:#0b0d0e;
  }
  html,body{margin:0;background:var(--bg)}
  .cover{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);
         font-family:"Inter","Inter Display",sans-serif;color:var(--ink)}
  .layer{position:absolute;inset:0}
  .flag{background:url(build/bg_flag.jpg) center/cover no-repeat;filter:brightness(1.05)}
  /* real front-line frame from the reel (0:51), fading into the flag behind the title */
  .war{bottom:auto;height:900px;background:url(build/bg_war.jpg) 0 -250px/1080px 1920px no-repeat;
       -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 55%,transparent 100%);
               mask-image:linear-gradient(to bottom,#000 0%,#000 55%,transparent 100%)}
  .shade{background:
          radial-gradient(ellipse 90% 40% at 50% 14%,transparent 50%,rgba(0,0,0,.45) 100%),
          linear-gradient(to bottom,rgba(0,0,0,.20) 0%,transparent 10%,transparent 46%,rgba(6,8,9,.80) 62%,rgba(6,8,9,.94) 100%)}

  /* two portraits, side by side, like archive prints */
  .portraits{position:absolute;left:60px;right:60px;top:440px;height:700px;display:flex;gap:24px}
  .p{position:relative;flex:1;overflow:hidden;background:#1a1d1f;
     box-shadow:0 30px 60px rgba(0,0,0,.55);outline:1px solid rgba(243,239,230,.18);outline-offset:-1px}
  .p img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
  .p:after{content:"";position:absolute;inset:0;
           background:linear-gradient(to bottom,transparent 55%,rgba(0,0,0,.78) 100%)}
  .p .ph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;
         font-size:28px;letter-spacing:.14em;color:#7d817f;border:3px dashed #3b4042;margin:24px;line-height:1.5}
  .p.empty .ph{display:flex}
  .p .name{position:absolute;left:28px;right:20px;bottom:26px;z-index:2}
  .p .name b{display:block;font-size:36px;font-weight:700;letter-spacing:.01em}
  .p .name i{display:block;font-style:normal;font-size:21px;letter-spacing:.08em;color:var(--muted);margin-top:6px;text-transform:uppercase}

  .text{position:absolute;left:84px;right:84px;top:1196px}
  .kicker{display:flex;align-items:center;gap:22px;font-weight:600;font-size:30px;letter-spacing:.24em;color:var(--muted)}
  .kicker:before{content:"";width:72px;height:5px;
                 background:linear-gradient(to right,#0092b8 0 33.3%,var(--red) 33.3% 66.6%,#3f8a2a 66.6%)}
  h1{margin:26px 0 0;font-family:"Inter Display","Inter",sans-serif;font-weight:900;font-size:112px;
     line-height:.98;letter-spacing:-.005em;text-transform:uppercase;text-shadow:0 4px 30px rgba(0,0,0,.55)}
  h1 span{display:block}
  .sub{margin-top:34px;font-size:42px;line-height:1.3;font-weight:500;opacity:.92;max-width:880px}
  .foot{position:absolute;left:84px;right:84px;bottom:84px;display:flex;justify-content:space-between;
        font-size:24px;letter-spacing:.2em;font-weight:600;color:var(--muted);opacity:.75}
</style>
</head>
<body>
<div class="cover" id="cover">
  <div class="layer flag"></div>
  <div class="layer war"></div>
  <div class="layer shade"></div>
  <div class="portraits">
    <div class="p"><img src="build/p1.jpg" alt=""><div class="ph">ELŞƏN AĞAYEVİN<br>REAL FOTOSU</div>
      <div class="name"><b>Elşən Ağayev</b><i>Anestezioloq-reanimatoloq</i></div></div>
    <div class="p"><img src="build/p2.jpg" alt=""><div class="ph">SEVDA MƏMMƏDOVANIN<br>REAL FOTOSU</div>
      <div class="name"><b>Sevda Məmmədova</b><i>Böyük tibb bacısı</i></div></div>
  </div>
  <div class="text">
    <div class="kicker">VƏTƏN MÜHARİBƏSİ · 44 GÜN</div>
    <h1><span>Zəfərin</span><span>görünməyən</span><span>qəhrəmanları</span></h1>
    <div class="sub">Vətən müharibəsində həyat xilas edən həkimlərin xatirələri</div>
  </div>
  <div class="foot"><span>QƏBUL VAXTI</span><span>ARAZ FM 103.3</span></div>
</div>
<script>
  // a missing photo shows a clearly marked empty slot instead of a broken image
  document.querySelectorAll('.p img').forEach(img => {
    const mark = () => { img.closest('.p').classList.add('empty'); img.remove(); };
    if (img.complete && !img.naturalWidth) mark(); else img.addEventListener('error', mark);
  });
</script>
</body>
</html>
