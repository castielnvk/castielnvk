function lattice(L,w){const gs=[];const c=[[-w/2,-w/2],[w/2,-w/2],[w/2,w/2],[-w/2,w/2]];

  const seg=w*1.05;let k=0;for(let y=0;y+seg<=L+0.01;y+=seg,k++){const t0=taper(y),t1=taper(y+seg);
    for(let f=0;f<4;f++){const a=c[f],b=c[(f+1)%4];const flip=k%2;
      const p0=V((flip?a:b)[0]*t0,y,(flip?a:b)[1]*t0),p1=V((flip?b:a)[0]*t1,y+seg,(flip?b:a)[1]*t1);gs.push(beamGeo(p0,p1,0.035,4));
      gs.push(beamGeo(V(a[0]*t0,y,a[1]*t0),V(b[0]*t0,y,b[1]*t0),0.03,4));}}
  return mergeGeometries(gs);}

function sevenState(t){const tip=craneB.tip;
