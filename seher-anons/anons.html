<!doctype html><html lang="az"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/node_modules/@fontsource/bangers/index.css">
<link rel="stylesheet" href="fonts/node_modules/@fontsource/anton/index.css">
<link rel="stylesheet" href="fonts/node_modules/@fontsource/barlow-condensed/800-italic.css">
<link rel="stylesheet" href="fonts/node_modules/@fontsource/barlow-condensed/700.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#000}
#st{position:absolute;inset:0;overflow:hidden}
.a{position:absolute}
.an{font-family:Anton;line-height:1;white-space:nowrap}
.bc{font-family:'Barlow Condensed';font-weight:800;font-style:italic;text-transform:uppercase;line-height:1;white-space:nowrap}
.sm{font-family:'Barlow Condensed';font-weight:700;letter-spacing:6px;white-space:nowrap}
.bg{font-family:Bangers;line-height:1;white-space:nowrap}
.ink{position:relative;display:inline-block;z-index:0}
.ink::before{content:attr(data-t);position:absolute;left:0;top:0;z-index:-1;-webkit-text-stroke:var(--sw) var(--sc);color:var(--sc);text-shadow:var(--ex)}
.dots{background-image:radial-gradient(circle,var(--dc) 30%,transparent 32%);background-size:var(--ds,14px) var(--ds,14px)}
.cap{display:inline-block;border:6px solid #111;box-shadow:9px 9px 0 #111;padding:10px 26px 12px}
</style></head><body><div id="st"></div>
<script>
const Q=new URLSearchParams(location.search),P=Q.get('p')||'1';const st=document.getElementById('st');
const C=Object.assign({date:'16 NOYABR',n:121},JSON.parse(Q.get('c')||'{}'));
const anims=[],lives=[];
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const back=x=>{x=cl(x);const c=2.2;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const out=x=>1-Math.pow(1-cl(x),3);
function el(html,css,cls,parent){const d=document.createElement('div');d.className='a '+(cls||'');d.style.cssText=css;d.innerHTML=html;(parent||st).appendChild(d);return d}
const ext=(n,c)=>Array.from({length:n},(_,i)=>`${i+1}px ${i+1}px 0 ${c}`).join(',');
const ink=(t,cls,size,col,sw,sc,ex,ls=2)=>`<span class="${cls} ink" data-t="${t}" style="font-size:${size}px;color:${col};--sw:${sw}px;--sc:${sc};--ex:${ex||'none'};letter-spacing:${ls}px">${t}</span>`;
function pop(e,t0,base='',dur=.4){anims.push(t=>{const k=(t-t0)/dur;e.style.opacity=k<=0?0:1;e.style.transform=`${base} scale(${k<=0?0:back(k)})`})}
function slam(e,t0,base='',dur=.3){anims.push(t=>{const k=cl((t-t0)/dur);e.style.opacity=k<=0?0:cl(k*3);const s=3-2*out(k);const sh=k>=1?Math.sin((t-t0-dur)*60)*Math.max(0,1-(t-t0-dur)/.18)*5:0;e.style.transform=`translate(${sh}px,0) ${base} scale(${s})`})}
function slide(e,t0,dx,dy,base='',dur=.45){anims.push(t=>{const k=(t-t0)/dur;e.style.opacity=k<=0?0:1;const o=1-out(k);e.style.transform=`translate(${dx*o}px,${dy*o}px) ${base}`})}
function fade(e,t0,dur=.4){anims.push(t=>e.style.opacity=cl((t-t0)/dur))}
function wob(e,t0,base,amp=1.2,sp=2.2){anims.push(t=>{if(t>t0+.5)e.style.transform=`${base} rotate(${Math.sin((t-t0)*sp)*amp}deg) scale(${1+Math.sin((t-t0)*sp*1.3)*.012})`})}
const live=(css,parent)=>{const d=el('<img style="display:block;'+(css||'')+'">','left:0;top:0','',parent);lives.push(d.firstChild);return d};
const logosDark=()=>{el('<img src="l100.png">','left:71px;top:152px;z-index:50');el('<img src="larazw.png" style="width:166px">','left:838px;top:183px;z-index:50')};
const logosLight=()=>el('<img src="logo.png">','left:0;top:0;z-index:50');
const flash=()=>{const f=el('','inset:0;background:#fff;z-index:90');anims.push(t=>f.style.opacity=cl(1-t/.25))};
if(P==='1'){
  const B=C.B,L=C.n/24,E=C.ev,END=E.end;
  const hits=[0,E.m,E.c3,END];
  const bump=(t,amt)=>hits.reduce((a,h)=>a+(t>=h?amt*Math.exp(-(t-h)*9):0),0);
  // art with slow push + gentle beat bumps
  const art=live();art.style.transformOrigin='50% 45%';anims.push(t=>art.style.transform=`scale(${1.0+.045*cl(t/14.1)+bump(t,.012)})`);
  const dt=el('','inset:0;--dc:rgba(0,0,0,.22);--ds:7px;mix-blend-mode:multiply;mask-image:linear-gradient(#000,transparent 30%,transparent 62%,#000)','dots');anims.push(t=>dt.style.backgroundPosition=`${t*5}px ${t*3}px`);
  // impact stickers synced to the telescope gag in every loop
  C.st.forEach(([w,c,t0,sx,sy])=>{
    const pts=[];for(let i=0;i<24;i++){const r=i%2?.72:1,a=Math.PI*i/12;pts.push((50+50*r*Math.cos(a)).toFixed(1)+'% '+(50+50*r*Math.sin(a)).toFixed(1)+'%')}
    const s=el(`<div style="position:absolute;inset:0;background:#111;clip-path:polygon(${pts.join(',')})"></div><div style="position:absolute;inset:10px;background:#FFE500;clip-path:polygon(${pts.join(',')})"></div><div class="bg" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:${w.length>7?54:w.length>5?66:w.length>4?80:96}px;color:${c};-webkit-text-stroke:3px #111;letter-spacing:3px;padding-top:8px">${w}</div>`,`left:${sx}px;top:${sy}px;width:310px;height:310px`);
    anims.push(t=>{const k1=(t-t0)/.16,k2=(t-t0-.85)/.14;const sc=k1<=0||k2>=1?0:(k2>0?1-out(k2):back(k1));s.style.opacity=sc>0?1:0;s.style.transform=`rotate(${12+Math.sin((t-t0)*30)*Math.max(0,1-(t-t0)*3)*6}deg) scale(${sc})`});
    // impact lines
    const ln=el('',`left:${sx-95}px;top:${sy-95}px;width:500px;height:500px;background:repeating-conic-gradient(#fff 0 2deg,transparent 2deg 15deg);border-radius:50%`);
    anims.push(t=>{const k=(t-t0)/.35;ln.style.opacity=k<=0||k>=1?0:.9*(1-k);const r=28+k*22;ln.style.maskImage=`radial-gradient(circle,transparent ${r}%,#000 ${r+3}%,#000 ${r+16}%,transparent ${r+19}%)`});
  });
  el('','left:0;top:0;width:1080px;height:680px;background:linear-gradient(rgba(10,6,48,.9),rgba(10,6,48,.55) 45%,transparent)');
  const gb=el('','left:0;top:1120px;width:1080px;height:800px;background:linear-gradient(transparent,rgba(10,6,48,.93) 55%)');
  const gapK=t=>C.gap?out((t-C.gap[0])/.3)-out((t-C.gap[1])/.35):0;
  anims.push(t=>gb.style.opacity=cl((t-(E.c1-.35))/.5)*(1-.8*gapK(t)));
  // loop-cut comic wipes (also the intro reveal)
  const cover=el('','inset:0;background:#0a0630');anims.push(t=>cover.style.transform=`translateX(${out(t/.38)*1500}px) skewX(-12deg) scaleX(1.5)`);
  [0,L,2*L].forEach((tl,j)=>{[['#FFE500',0],['#6A2BFF',.05],['#0a0630',.1]].forEach(([c,d],i)=>{const w=el('',`left:-260px;top:-60px;width:${j?520-i*150:260-i*60}px;height:2040px;background:${c}`);
    anims.push(t=>{const k=j?(t-(tl-.2)-d*.6)/.42:(t-d)/.4;w.style.opacity=k<=0||k>=1?0:1;w.style.transform=`translateX(${-400+k*2200}px) skewX(-12deg)`})})});
  // gold frame draws on
  const fr=el(`<svg width="1080" height="1920"><rect id="r1" x="27.5" y="27.5" width="1025" height="1865" fill="none" stroke="rgba(255,229,0,.92)" stroke-width="3"/><rect id="r2" x="36.5" y="36.5" width="1007" height="1847" fill="none" stroke="rgba(255,229,0,.5)" stroke-width="1"/></svg>`,'left:0;top:0');
  const r1=fr.querySelector('#r1'),r2=fr.querySelector('#r2'),PL=5780;[r1,r2].forEach(r=>r.setAttribute('stroke-dasharray',PL));
  anims.push(t=>{r1.setAttribute('stroke-dashoffset',PL*(1-out((t-.3)/1.0)));r2.setAttribute('stroke-dashoffset',-PL*(1-out((t-.5)/1.0)))});
  logosDark();
  // date tag stamps in
  const tg=el(`<span class="sm" style="font-size:30px;color:#111;background:#FFE500;padding:4px 14px 4px 18px">BURAXILIŞ • ${C.date}</span>`,'left:70px;top:292px;transform-origin:30% 50%');
  anims.push(t=>{const k=cl((t-E.tag)/.2);tg.style.opacity=t<E.tag?0:1;tg.style.transform=`rotate(${-2-10*(1-out(k))}deg) scale(${2.2-1.2*out(k)})`});
  // SABAHIN — per-letter drop, back (stroke+extrude) and front (fill) layers
  const mk=(front)=>{const row=el('','left:66px;top:342px;display:flex;transform:rotate(-2deg);transform-origin:0 50%');return [...'SABAHIN'].map(ch=>{const s=document.createElement('span');s.className='an';s.textContent=ch;s.style.cssText=`display:block;font-size:150px;margin-right:5px;transform-origin:50% 100%;`+(front?'color:#FFE500':`color:#0b0820;-webkit-text-stroke:13px #0b0820;text-shadow:${ext(12,'#6A2BFF')}`);row.appendChild(s);return s})};
  const bk=mk(false),fn=mk(true);
  anims.push(t=>{for(let i=0;i<7;i++){const k=(t-(.08+i*.05))/.3;let y=0,sx=1,sy=1,op=k<=0?0:1;
      if(k<1){const e=back(k);y=-260*(1-e);const q=cl((k-.55)/.45);sy=1-.18*Math.sin(Math.PI*q);sx=1+.14*Math.sin(Math.PI*q)}
      for(const tw of [E.w1,E.w2]){const kw=(t-tw-i*.045)/.32;if(kw>0&&kw<1){y=-34*Math.sin(Math.PI*kw);sy=1+.08*Math.sin(Math.PI*kw)}}
      const b=1+bump(t,.03)*(t>1?1:0);
      for(const s of [bk[i],fn[i]]){s.style.opacity=op;s.style.transform=`translateY(${y}px) scale(${sx*b},${sy*b})`}}});
  const b2=el(ink('MÖVZUSU','an',82,'#fff',11,'#0b0820',ext(8,'#6A2BFF'),9),'left:72px;top:500px;transform-origin:30% 50%');slam(b2,E.m-.06,'rotate(-2deg)',.26);
  // captions: bar wipe reveal
  const cap=(html,x,y,t0,bar)=>{const c=el(html,`left:${x}px;top:${y}px`,'qx');const br=el('',`left:${x-10}px;top:${y-6}px;width:40px;height:120px;background:${bar};border:6px solid #111`);
    anims.push(t=>{const k=out((t-t0)/.34);const w=c.offsetWidth+20;c.style.opacity=t<t0?0:1;c.style.clipPath=`inset(-20px ${(1-k)*100}% -20px -20px)`;c.style.transform=`translateX(${-30*(1-k)}px) rotate(-1.5deg)`;
      br.style.opacity=t<t0||k>=.999?0:1;br.style.transform=`translateX(${k*w}px) rotate(-1.5deg)`});return c};
  cap('<div class="cap bc" style="background:#FFF6C9;color:#111;font-size:70px">'+C.l1+'</div>',64,1330,E.c1,'#6A2BFF');
  cap('<div class="cap bc" style="background:#FFF6C9;color:#111;font-size:70px">'+C.l2+'</div>',120,1432,E.c2,'#FF3D2E');
  // big word: burst + pop + beat pulse + wiggling question mark
  const bu=el('','left:-120px;top:1165px;width:900px;height:900px;border-radius:50%;background:repeating-conic-gradient(#FFE500 0 3deg,transparent 3deg 12deg)');
  anims.push(t=>{const k=(t-E.c3)/.5;bu.style.opacity=k<=0||k>=1?0:(1-k);const r=12+k*34;bu.style.maskImage=`radial-gradient(circle,transparent ${r}%,#000 ${r+2}%,#000 ${r+12}%,transparent ${r+15}%)`});
  const c3=el('<div class="cap bc" style="background:#6A2BFF;color:#FFE500;font-size:130px;padding:6px 36px 14px;box-shadow:11px 11px 0 #8CFF3C">'+C.big+'<span id="qm" style="display:inline-block;transform-origin:50% 85%">?</span></div>','left:64px;top:1534px;transform-origin:20% 60%','qx');
  const qm=c3.querySelector('#qm');
  anims.push(t=>{const t0=E.c3,k=(t-t0)/.3;c3.style.opacity=k<=0?0:1;let s=k<=0?0:back(k);
    if(t>t0+.6){const ph=((t/B)%1+1)%1;s=1+.035*Math.exp(-ph*5)}
    s+=t>=END?.06*Math.exp(-(t-END)*7):0;c3.style.transform=`rotate(${-1.5+(k>0&&k<1?-6*(1-out(k)):0)}deg) scale(${s})`;
    qm.style.transform=`rotate(${t>t0+.3?Math.sin((t-t0)*5.2)*11:0}deg) scale(${t>t0+.3?1+.08*Math.sin((t-t0)*10.4):1})`});
  // footer line, then end badge
  const ft=el('<span class="sm" style="font-size:30px;color:#fff">HƏFTƏİÇİ HƏR SƏHƏR <span style="color:#FFE500">08:00 — 10:30</span></span>','left:70px;top:1756px','qx');
  anims.push(t=>{const k=out((t-E.ft)/.4);ft.style.opacity=t>E.bd-.15?cl(1-(t-(E.bd-.15))/.12):k;ft.style.transform=`translateY(${(1-k)*24}px)`});
  const eb=el('<div style="display:flex;align-items:center;gap:22px"><div class="an" style="background:#FFE500;color:#111;font-size:62px;padding:6px 26px 10px;border:6px solid #111;box-shadow:8px 8px 0 #8CFF3C;letter-spacing:2px">08:00 — 10:30</div><span class="sm" style="font-size:30px;color:#fff;line-height:1.15">HƏFTƏİÇİ<br>HƏR SƏHƏR</span></div>','left:64px;top:1722px;transform-origin:15% 50%');
  anims.push(t=>{const k=(t-E.bd)/.3;eb.style.opacity=k<=0?0:1;eb.style.transform=`rotate(-1.5deg) scale(${(k<=0?0:back(k))+(t>=END?.07*Math.exp(-(t-END)*7):0)})`});
  const cw=el('','inset:0');document.querySelectorAll('.qx').forEach(e=>cw.appendChild(e));anims.push(t=>cw.style.transform=`translateX(${-1150*gapK(t)}px)`);
  const fl=el('','inset:0;background:#fff;z-index:90');anims.push(t=>fl.style.opacity=(t>=END?.22*Math.exp(-(t-END)*10):0)+(t>=E.c3?.16*Math.exp(-(t-E.c3)*12):0));
}
if(P==='2'){
  live();
  el('','left:0;top:0;width:1080px;height:760px;--dc:rgba(106,43,255,.5);--ds:20px;mask-image:radial-gradient(ellipse 90% 80% at 12% 0%,#000 25%,transparent 75%)','dots');
  el('','left:0;top:1200px;width:1080px;height:720px;--dc:rgba(255,61,46,.6);--ds:20px;mask-image:radial-gradient(ellipse 80% 80% at 100% 100%,#000 20%,transparent 70%)','dots');
  el('','inset:0;border:22px solid #111');el('','inset:22px;border:6px solid #FFE500');
  logosLight();
  const a=el(ink('SABAHIN','bg',180,'#FFE500',18,'#111',ext(12,'#6A2BFF'),8),'left:230px;top:296px;transform-origin:40% 50%');slam(a,.15,'rotate(-5deg)');
  const b=el('<div class="bg" style="background:#FF3D2E;color:#fff;font-size:62px;padding:6px 28px 0;border:7px solid #111;box-shadow:8px 8px 0 #111;letter-spacing:6px">MÖVZUSU</div>','left:80px;top:452px');slide(b,.55,-700,0,'rotate(-5deg)');
  const bl=el(`<svg width="900" height="470" viewBox="0 0 900 470" style="overflow:visible;filter:drop-shadow(12px 12px 0 #6A2BFF)"><path d="M70 110 H520 L640 0 L610 110 H830 Q880 110 880 160 V400 Q880 450 830 450 H70 Q20 450 20 400 V160 Q20 110 70 110 Z" fill="#fff" stroke="#111" stroke-width="10" stroke-linejoin="round"/></svg>
  <div class="bg" style="position:absolute;left:20px;top:110px;width:860px;height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:84px;color:#111;letter-spacing:3px;line-height:1.1;padding-top:10px"><div>İNSANLAR NİYƏ</div><div>BAŞQALARININ HƏYATINA</div><div style="color:#FF3D2E;font-size:104px">QARIŞIR?</div></div>`,'left:90px;top:1180px;transform-origin:68% 0%');pop(bl,2.4,'rotate(1.5deg)',.4);wob(bl,2.4,'rotate(1.5deg)',.9,2);
  const tm=el('<div class="bg" style="background:#FFE500;color:#111;font-size:76px;padding:12px 60px 4px 48px;border:7px solid #111;box-shadow:10px 10px 0 #111;letter-spacing:4px">HƏR SƏHƏR 08:00 – 10:30</div>','left:44px;top:1690px');slide(tm,3.5,-1100,0,'rotate(-3deg)');
  flash();
}
if(P==='3'){
  st.style.background='#0c0a14';
  const pn=(poly)=>el('',`inset:0;clip-path:${poly}`);
  const p1=pn('polygon(0 0,100% 0,100% 660px,0 760px)');live('',p1);el('','inset:0;--dc:rgba(106,43,255,.45);--ds:18px;mask-image:linear-gradient(#000,transparent 40%)','dots',p1);
  const p2=pn('polygon(0 778px,100% 678px,100% 1250px,0 1350px)');live('width:1242px;position:absolute;left:-60px;top:-205px',p2);
  el('','inset:0;background:repeating-conic-gradient(from 0deg at 52% 53%,rgba(255,255,255,.7) 0 1.2deg,transparent 1.2deg 6deg);mask-image:radial-gradient(ellipse 62% 23% at 52% 53%,transparent 80%,#000 100%)','',p2);
  const p3=pn('polygon(0 1368px,100% 1268px,100% 100%,0 100%)');el('','inset:0;background:linear-gradient(160deg,#6A2BFF,#2A0F7A)','',p3);el('','inset:0;--dc:rgba(255,229,0,.35);--ds:18px;mask-image:linear-gradient(120deg,transparent 55%,#000)','dots',p3);
  slide(p1,.1,-1100,0,'',.4);slide(p2,.4,1100,0,'',.4);slide(p3,.7,0,700,'',.4);
  logosLight();
  const a=el(ink('SABAHIN MÖVZUSU','an',128,'#FFE500',12,'#111',ext(10,'#6A2BFF'),3),'left:0;width:1080px;text-align:center;top:300px');slam(a,1.0,'rotate(-3deg)');
  const s=el(ink('NƏ VAR, NƏ YOX?','bg',80,'#fff',12,'#111',ext(5,'#FF3D2E'),4),'left:440px;top:1135px');pop(s,2.0,'rotate(-6deg)');wob(s,2.0,'rotate(-6deg)',2,7);
  const q=el('','left:64px;top:1420px;transform:rotate(-5.3deg);transform-origin:0 0');
  [['İnsanlar niyə','font-size:104px;color:#fff'],['başqalarının <span style="background:#FFE500;color:#111;padding:0 18px 4px 10px">həyatına</span>','font-size:96px;color:#fff;margin-top:6px'],['qarışır?','font-size:150px;color:#FFE500;margin-top:2px']].forEach((l,i)=>{const d=document.createElement('div');d.className='bc';d.style.cssText=l[1];d.innerHTML=l[0];q.appendChild(d);slide(d,2.6+i*.4,-1000,0,'',.35)});
  const ft=el('<span class="sm" style="font-size:30px;color:#fff">HƏFTƏİÇİ HƏR SƏHƏR <span style="color:#FFE500">08:00 — 10:30</span></span>','left:70px;top:1800px');fade(ft,4.0,.5);
  flash();
}
window.setT=async(t,i)=>{const s=`fr/N/${String(((i-1)%C.n)+1).padStart(4,'0')}.jpg`;
  await Promise.all(lives.map(im=>{if(im.dataset.s===s)return;im.dataset.s=s;im.src=s;return im.decode()}));anims.forEach(f=>f(t))};
</script></body></html>
