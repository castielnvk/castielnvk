<!doctype html>
<html><head><meta charset="utf-8"><title>Ilk Defe Araz</title>
<style>
@font-face{font-family:M;font-weight:600;src:url(fonts/montserrat-latin-600-normal.woff2)}
@font-face{font-family:M;font-weight:600;src:url(fonts/montserrat-latin-ext-600-normal.woff2);unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:M;font-weight:800;src:url(fonts/montserrat-latin-800-normal.woff2)}
@font-face{font-family:M;font-weight:800;src:url(fonts/montserrat-latin-ext-800-normal.woff2);unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:M;font-weight:900;src:url(fonts/montserrat-latin-900-normal.woff2)}
@font-face{font-family:M;font-weight:900;src:url(fonts/montserrat-latin-ext-900-normal.woff2);unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
/* =====================================================================
   «İLK DƏFƏ “ARAZ”DA DİNLƏ» — premiere template v5 (motion design)
   Texts are ONLY: date, time, İLK DƏFƏ, “ARAZ”DA, DİNLƏ (+ the Araz logo).
   Design language of the original promo: white Montserrat Black, orange 60° slash, logo bottom centre.
   Motion: depth typography behind the people (segmentation masks), member split-screen,
   kinetic words that fly into the lockup, rolling clock digits, slash wipes, marquee rows.
   All timing is relative to the anchors in config.json, so the choreography stays stable.
   ===================================================================== */
const W = 1080, H = 1920;
const C = document.getElementById('c'); let ctx = C.getContext('2d');
const BUF = mk(), BCTX = BUF.getContext('2d');      // motion-blur accumulation
const PBUF = mk(), PCTX = PBUF.getContext('2d');    // person (masked footage) layer
function mk() { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; }
// Araz Radio brand teal #095d6a (+ tints/shades of it)
const OR = { main: '#095D6A', light: '#0F7D8C', deep: '#064852', dark: '#03292F', bright: '#3FC1CF' };
const K = 0.58;                                     // slash slope (≈60°)
let CFG = null, A = null, LOGO = null;
const IMG = new Map();
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, a, d) => clamp((t - a) / d);
const expoOut = p => (p = clamp(p)) >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
const expoIn = p => (p = clamp(p)) <= 0 ? 0 : Math.pow(2, 10 * p - 10);
const quintIO = p => { p = clamp(p); return p < .5 ? 16 * p ** 5 : 1 - Math.pow(-2 * p + 2, 5) / 2; };
const cubicIO = p => { p = clamp(p); return p < .5 ? 4 * p ** 3 : 1 - Math.pow(-2 * p + 2, 3) / 2; };
const expoIO = p => { p = clamp(p); return p === 0 ? 0 : p === 1 ? 1 : p < .5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2; };

function loadImg(src) {
  if (IMG.has(src)) return IMG.get(src);
  const p = new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
  IMG.set(src, p); return p;
}
const fno = (src, dt) => Math.max(1, Math.round((src + dt) * CFG.fps) + 1);
const fpath = (clip, n, m) => `${CFG.frames}/${clip}${m ? '_m' : ''}/${String(Math.min(n, 361)).padStart(4, '0')}.${m ? 'png' : 'jpg'}`;

/* ---------------- footage ---------------- */
function shotAt(t) {
  const S = CFG.shots; let i = 0;
  for (let k = 0; k < S.length; k++) if (t >= S[k].start) i = k;
  return { i, s: S[i], end: i + 1 < S.length ? S[i + 1].start : CFG.duration };
}
function placement(im, s, p) {
  const z = lerp(s.z[0], s.z[1], cubicIO(p));
  const w = im.width * z, h = im.height * z;
  let x = W / 2 - (s.cx ?? .5) * w, y = H / 2 - (s.cy ?? .5) * h;
  x = w >= W ? clamp(x, W - w, 0) : (W - w) / 2; y = h >= H ? clamp(y, H - h, 0) : (H - h) / 2;
  return [x, y, w, h];
}
const GRADEF = 'contrast(1.05) saturate(1.03)';
async function drawShot(s, t, p) {
  let n = fno(s.src, (t - s.start) * (s.speed || 1));
  let im = await loadImg(fpath(s.clip, n));
  while (!im && n > 1) { n--; im = await loadImg(fpath(s.clip, n)); }   // never run past the clip's last frame
  const [x, y, w, h] = placement(im, s, p);
  ctx.imageSmoothingQuality = 'high';
  ctx.filter = GRADEF; ctx.drawImage(im, x, y, w, h); ctx.filter = 'none';
  if (h < H) for (const [y0, up] of [[y, 1], [y + h, -1]]) {
    const g = ctx.createLinearGradient(0, y0, 0, y0 + up * 140); g.addColorStop(0, '#000'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, Math.min(y0, y0 + up * 140) - 2, W, 144);
  }
  if (!s.depth) return false;
  const m = await loadImg(fpath(s.clip, n, true)); if (!m) return false;
  PCTX.setTransform(1, 0, 0, 1, 0, 0); PCTX.globalCompositeOperation = 'source-over'; PCTX.clearRect(0, 0, W, H);
  PCTX.imageSmoothingQuality = 'high';
  PCTX.filter = GRADEF; PCTX.drawImage(im, x, y, w, h); PCTX.filter = 'none';
  PCTX.globalCompositeOperation = 'destination-in'; PCTX.drawImage(m, x, y, w, h);
  PCTX.globalCompositeOperation = 'source-over';
  return true;
}

/* ---------------- helpers ---------------- */
function blurred(t, fn, n = 6, span = 1 / 48) {
  BCTX.setTransform(1, 0, 0, 1, 0, 0); BCTX.globalCompositeOperation = 'source-over'; BCTX.globalAlpha = 1;
  BCTX.clearRect(0, 0, W, H);
  const prev = ctx; ctx = BCTX;
  for (let i = 0; i < n; i++) { BCTX.save(); BCTX.globalCompositeOperation = 'lighter'; BCTX.globalAlpha = 1 / n; fn(t - span * i / n); BCTX.restore(); }
  ctx = prev; ctx.drawImage(BUF, 0, 0);
}
function leftOf(p) { ctx.beginPath(); ctx.moveTo(p + K * (-980), -20); ctx.lineTo(p + K * (H + 20 - 960), H + 20); ctx.lineTo(-4000, H + 20); ctx.lineTo(-4000, -20); ctx.closePath(); }
function band(pA, pB) { ctx.beginPath(); ctx.moveTo(pB + K * (-980), -20); ctx.lineTo(pA + K * (-980), -20); ctx.lineTo(pA + K * (H + 20 - 960), H + 20); ctx.lineTo(pB + K * (H + 20 - 960), H + 20); ctx.closePath(); }
function orangeFill() { const g = ctx.createLinearGradient(0, 600, 300, H); g.addColorStop(0, OR.light); g.addColorStop(1, OR.main); return g; }
const F = (w, s) => `${w} ${s}px M`;
function textW(str, f, tr = 0) { ctx.save(); ctx.font = f; ctx.letterSpacing = tr + 'px'; const w = ctx.measureText(str).width; ctx.restore(); return w; }
function fit(str, w, s, maxW) { while (s > 20 && textW(str, F(w, s)) > maxW) s -= 2; return s; }

/* ---------------- atmosphere ---------------- */
function grade() {
  let g = ctx.createRadialGradient(W / 2, H * .42, H * .25, W / 2, H * .5, H * .8);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.42)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  g = ctx.createLinearGradient(0, 1050, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = g; ctx.fillRect(0, 1050, W, H - 1050);
}
let GRAIN = [];
function makeGrain() {
  for (let k = 0; k < 6; k++) {
    const c = document.createElement('canvas'); c.width = 540; c.height = 960;
    const g = c.getContext('2d'), d = g.createImageData(540, 960);
    for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (Math.random() - .5) * 70; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    g.putImageData(d, 0, 0); GRAIN.push(c);
  }
}

/* ---------------- BEHIND typography: marquee rows (people stand in front) ---------------- */
function row(t, r) {
  const a = Math.min(clamp((t - r.in) / .3), r.out !== undefined ? clamp((r.out - t) / .2) : 1);
  if (a <= 0) return;
  const size = r.size, f = F(900, size), tr = r.tr ?? 2;
  const unit = textW(r.text, f, tr) + (r.gap ?? size * .6);
  const enter = expoOut(prog(t, r.in, .9));
  let off = (t - r.in) * r.speed * r.dir + (1 - enter) * 900 * -r.dir;
  off = ((off % unit) + unit) % unit;
  const sc = 1 + (r.push || 0) * (t - r.in);
  ctx.save(); ctx.globalAlpha = a * (r.alpha ?? 1);
  ctx.translate(W / 2, r.y); ctx.scale(sc, sc); ctx.translate(-W / 2, -r.y);
  ctx.font = f; ctx.letterSpacing = tr + 'px'; ctx.textBaseline = 'middle';
  for (let x = -unit * 2 + off; x < W + unit; x += unit) {
    if (r.style === 'outline') { ctx.lineWidth = r.lw ?? 3; ctx.strokeStyle = r.color || '#fff'; ctx.strokeText(r.text, x, r.y); }
    else { ctx.fillStyle = r.color === 'orange' ? OR.light : (r.color || '#fff'); ctx.fillText(r.text, x, r.y); }
  }
  ctx.restore();
}
function behind(t) { for (const r of (CFG.rows || [])) if (t >= r.in - .05 && (r.out === undefined || t <= r.out + .05)) row(t, r); }

/* ---------------- member split-screen (3 diagonal slices) ---------------- */
async function split(t) {
  const S = CFG.split; if (!S || t < S.in || t > S.out + .7) return;
  const P = [-4000, S.p[0], S.p[1], 4000];
  for (let i = 0; i < 3; i++) {
    const m = S.members[i];
    const tin = S.in + i * S.stagger, sgn = i % 2 ? 1 : -1;
    if (t < tin) continue;
    const im = await loadImg(fpath(m.clip, fno(m.src, t - tin)));
    const draw = tt => {
      const pin = 1 - expoOut(prog(tt, tin, .55)), pout = expoIn(prog(tt, S.out + i * .05, .45));
      const d = sgn * 2300 * pin - sgn * 2300 * pout;
      ctx.save(); ctx.translate(.5 * d, .866 * d);
      ctx.beginPath(); ctx.moveTo(P[i] + K * -980, -20); ctx.lineTo(P[i + 1] + K * -980, -20); ctx.lineTo(P[i + 1] + K * (H + 20 - 960), H + 20); ctx.lineTo(P[i] + K * (H + 20 - 960), H + 20); ctx.closePath();
      ctx.save(); ctx.clip();
      ctx.fillStyle = '#000'; ctx.fillRect(-3000, -3000, 8000, 8000);
      const zz = m.z * (1 + .05 * prog(tt, tin, 1.6));
      const w = im.width * zz, h = im.height * zz;
      ctx.filter = GRADEF; ctx.drawImage(im, m.fx - m.cx * w, m.fy - m.cy * h, w, h); ctx.filter = 'none';
      ctx.restore();
      if (i > 0) { band(P[i] + 4, P[i] - 4); ctx.fillStyle = '#fff'; ctx.fill(); }
      ctx.restore();
    };
    const moving = t < tin + .55 || t > S.out + i * .05;
    if (moving) blurred(t, draw, 6, 1 / 40); else draw(t);
  }
}

/* ---------------- FRONT: panel, wipes, glints ---------------- */
function panel(t) {
  const P = CFG.panel; if (t < P.in) return;
  const style = CFG.lockupStyle || 'slash';
  if (style !== 'slash') return decor(t, style, P);
  for (const [d, fin, kind] of [[0, P.edge + 70, 'line'], [.05, P.edge + 34, 'dark'], [.1, P.edge, 'main']]) {
    const draw = tt => {
      const e = lerp(-1500, fin, expoOut(prog(tt, P.in + d, .85))) + Math.sin((tt - P.in) * .6) * 6 * (kind === 'line' ? 1.6 : 1);
      if (kind === 'line') { band(e, e - 5); ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.fill(); }
      else { leftOf(e); ctx.fillStyle = kind === 'main' ? orangeFill() : OR.dark; ctx.fill(); }
    };
    if (t < P.in + d + .85) blurred(t, draw); else draw(t);
  }
}
/* alternative lockup backings (not the original's diagonal box) */
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function decor(t, style, P) {
  const L = CFG.lockup, st = L.style, X = L.x, e = expoOut(prog(t, P.in, .9));
  if (style === 'glass') {
    // frosted-glass card: blurred footage behind, teal tint, hairline border, teal accent bar
    const cw = Math.max(textW(L.l2, F(900, st.l2.size)), textW(L.l1, F(900, st.l1.size))) + (X - 36) + 54;
    const x0 = 36, y0 = st.date.y - 92, w = cw * e, h = st.l3.y - y0 + 52;
    if (w < 2) return;
    ctx.save(); rrect(x0, y0, w, h, 28); ctx.clip();
    ctx.filter = 'blur(26px) saturate(1.2)'; ctx.drawImage(C, 0, 0); ctx.filter = 'none';
    const g = ctx.createLinearGradient(x0, y0, x0 + cw, y0 + h);
    g.addColorStop(0, 'rgba(9,93,106,0.55)'); g.addColorStop(1, 'rgba(3,41,47,0.62)');
    ctx.fillStyle = g; ctx.fillRect(x0, y0, w, h);
    const sh = ctx.createLinearGradient(x0, y0, x0, y0 + 200); sh.addColorStop(0, 'rgba(255,255,255,0.10)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sh; ctx.fillRect(x0, y0, w, 200);
    ctx.restore();
    ctx.save(); rrect(x0 + .5, y0 + .5, w - 1, h - 1, 28); ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();
    ctx.fillStyle = OR.bright; ctx.fillRect(x0 + 18, y0 + 34, 6, (h - 68) * expoOut(prog(t, P.in + .2, .8)));
  } else if (style === 'chips') {
    // date & time as pills, teal underline under “ARAZ”DA — no box at all
    const f1 = F(800, st.date.size), f2 = F(600, st.time.size);
    const wd = textW(L.date, f1), wt = textW(L.time, f2);
    const a1 = expoOut(prog(t, P.in + .4, .6)), a2 = expoOut(prog(t, P.in + .55, .6));
    if (a1 > 0) { rrect(X - 22, st.date.y - st.date.size * .95, (wd + 44) * a1, st.date.size * 1.3, 40); ctx.fillStyle = OR.main; ctx.fill(); }
    if (a2 > 0) { rrect(X - 20, st.time.y - st.time.size * .93, (wt + 40) * a2, st.time.size * 1.3, 40); ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2.5; ctx.stroke(); }
    const ul = expoOut(prog(t, P.in + .5, .8)), w2 = textW(L.l2, F(900, st.l2.size));
    ctx.fillStyle = OR.bright; ctx.fillRect(X, st.l2.y + 18, w2 * ul, 10);
  } else if (style === 'frame') {
    // cinematic inset frame in brand teal + vertical accent bar beside the text
    const ins = 26, fe = expoOut(prog(t, P.in, 1.1)), bp = pulse(t);
    ctx.save(); ctx.strokeStyle = bp > .05 ? `rgba(${lerp(15, 120, bp) | 0},${lerp(125, 225, bp) | 0},${lerp(140, 235, bp) | 0},1)` : OR.light; ctx.lineWidth = 5 + 3 * bp;
    const per = 2 * (W - 2 * ins) + 2 * (H - 2 * ins);
    ctx.setLineDash([per * fe, per]); ctx.strokeRect(ins, ins, W - 2 * ins, H - 2 * ins); ctx.restore();
    const g = ctx.createLinearGradient(0, st.date.y - 140, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.3, 'rgba(0,0,0,0.45)'); g.addColorStop(1, 'rgba(0,0,0,0.6)');
    ctx.fillStyle = g; ctx.fillRect(0, st.date.y - 140, W, H);
    const bh = (st.l3.y - st.date.y + 70) * expoOut(prog(t, P.in + .2, .8));
    ctx.fillStyle = OR.bright; ctx.fillRect(X - 30, st.date.y - 52, 8 + 4 * bp, bh);
  }
}
function wipes(t) {
  for (const w of (CFG.wipes || [])) {
    const d = w.dur ?? .42, c = w.at;
    if (t < c - d - .12 || t > c + d + .12) continue;
    for (const [off, col] of [[-.08, OR.dark], [-.04, OR.deep], [0, 'main']]) {
      blurred(t, tt => {
        const a = c + off;
        const pA = lerp(-700, 1760, quintIO((tt - (a - d)) / d)), pB = lerp(-700, 1760, quintIO((tt - a + .02) / d));
        if (pA <= pB) return;
        band(pA, pB); ctx.fillStyle = col === 'main' ? orangeFill() : col; ctx.fill();
      }, 6, 1 / 40);
    }
    const pB = lerp(-700, 1760, quintIO((t - c + .02) / d));
    if (t > c - .02 && t < c + d) { band(pB + 6, pB); ctx.fillStyle = 'rgba(226,250,252,0.85)'; ctx.fill(); }
  }
}
function opening(t) {
  const o = CFG.opening; if (!o || t > o.dur + .3) return;
  for (const [off, col] of [[0.10, 'main'], [0.05, OR.deep], [0, OR.dark]]) {
    blurred(t, tt => {
      const e = lerp(-700, 1760, quintIO((tt - off - (o.start || 0)) / o.dur)); if (e >= 1760) return;
      ctx.beginPath(); ctx.moveTo(e + K * (-980), -20); ctx.lineTo(3000, -20); ctx.lineTo(3000, H + 20); ctx.lineTo(e + K * (H + 20 - 960), H + 20); ctx.closePath();
      ctx.fillStyle = col === 'main' ? orangeFill() : col; ctx.fill();
    }, 6, 1 / 40);
  }
}
function glints(t) {
  for (const g of (CFG.glints || [])) {
    const p = (t - g) / .55; if (p < 0 || p > 1) continue;
    const x = lerp(-800, 1900, cubicIO(p));
    ctx.save(); ctx.globalCompositeOperation = 'screen';
    for (const [wd, a] of [[140, .10], [36, .28], [6, .85]]) { band(x + wd / 2, x - wd / 2); ctx.fillStyle = `rgba(190,240,246,${a})`; ctx.fill(); }
    ctx.restore();
  }
}

/* ---------------- FRONT typography: kinetic words → lockup ---------------- */
function drawText(str, x, y, size, o = {}) {
  ctx.save(); ctx.font = F(o.w || 900, size); ctx.letterSpacing = (o.tr || 0) + 'px';
  ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = o.shadow ?? 18; ctx.shadowOffsetY = 4;
  ctx.globalAlpha = o.a ?? 1;
  if (o.outline) { ctx.lineWidth = o.outline; ctx.strokeStyle = o.color || '#fff'; ctx.strokeText(str, x, y); }
  else { ctx.fillStyle = o.color || '#fff'; ctx.fillText(str, x, y); }
  ctx.restore();
}
function letters(str, x, y, size, t, t0, o = {}) {           // letters rise one by one from a mask
  const f = F(o.w || 900, size); let cx = x;
  for (const [i, ch] of [...str].entries()) {
    const cw = textW(ch, f);
    const p = prog(t, t0 + i * (o.stagger ?? .03), o.dur ?? .45);
    if (p > 0) {
      const e = expoOut(p);
      ctx.save(); ctx.beginPath(); ctx.rect(cx - 30, y - size * 1.05, cw + 60, size * 1.32); ctx.clip();
      drawText(ch, cx, y + (1 - e) * size * 1.1, size, o); ctx.restore();
    }
    cx += cw;
  }
}
function echo(str, x, y, size, t, t0) {                       // outline copies collapsing into the word
  const p = prog(t, t0, .55); if (p >= 1) return;
  for (let k = 4; k >= 1; k--) {
    const off = (1 - expoOut(p)) * k * size * .42, a = (1 - p) * .9 * (1 - k * .15);
    drawText(str, x, y + off, size, { outline: 3, a, shadow: 0 });
  }
}
function rolling(str, x, y, size, t, t0, o = {}) {            // slot-counter digits
  const f = F(o.w || 600, size); let cx = x;
  for (const [i, ch] of [...str].entries()) {
    const cw = textW(ch, f);
    const p = prog(t, t0 + i * .045, .8);
    if (p > 0) {
      ctx.save(); ctx.beginPath(); ctx.rect(cx - 6, y - size * 1.0, cw + 12, size * 1.25); ctx.clip();
      if (/\d/.test(ch)) {
        const pos = expoOut(p) * (10 + +ch);
        for (let k = Math.floor(pos) - 1; k <= Math.floor(pos) + 1; k++) {
          const dy = (k - pos) * size * 1.15;
          if (Math.abs(dy) < size * 1.3) drawText(String(((k % 10) + 10) % 10), cx, y + dy, size, { ...o, shadow: 10 });
        }
      } else drawText(ch, cx, y + (1 - expoOut(p)) * size * 1.1, size, { ...o, shadow: 10 });
      ctx.restore();
    }
    cx += cw;
  }
}
function shine(t, str, x, y, size) {
  for (const s of (CFG.shine || [])) {
    const sp = (t - s) / .7; if (sp < 0 || sp > 1) continue;
    const f = F(900, size), tw = textW(str, f);
    const L = document.createElement('canvas'); L.width = Math.ceil(tw + 40); L.height = Math.ceil(size * 1.4);
    const g = L.getContext('2d'); g.font = f; g.fillStyle = '#fff'; g.fillText(str, 10, size * 1.05);
    g.globalCompositeOperation = 'source-in';
    const c = lerp(-200, tw + 200, cubicIO(sp)), gr = g.createLinearGradient(c - 90, 0, c + 90, 0);
    gr.addColorStop(0, 'rgba(120,220,232,0)'); gr.addColorStop(.5, 'rgba(110,215,228,0.95)'); gr.addColorStop(1, 'rgba(120,220,232,0)');
    g.fillStyle = gr; g.fillRect(0, 0, L.width, L.height);
    ctx.drawImage(L, x - 10, y - size * 1.05);
  }
}
function kinetic(t) {
  const L = CFG.lockup, k = A.words, s = A.settle, X = L.x, st = L.style;
  if (t < k) return;
  const cx = W / 2, cy = L.centerY ?? 1000;
  const s1 = fit(L.l1, 900, 190, 920), s2 = fit(L.l2, 900, 230, 980), s3 = fit(L.l3, 900, 190, 900);
  const T2 = A.words2, T3 = A.words3;
  // state functions for the FLIP (centre → lockup)
  const st2 = tt => { const up = expoOut(prog(tt, T3, .5)), f = expoIO(prog(tt, s, .7));
    const size = lerp(lerp(s2, s2 * .84, up), st.l2.size, f), y = lerp(lerp(cy, cy - s3 * .95, up), st.l2.y, f);
    return { size, y, x: lerp(cx - textW(L.l2, F(900, size)) / 2, X, f) }; };
  const st3 = tt => { const f = expoIO(prog(tt, s, .7)), size = lerp(s3, st.l3.size, f);
    return { size, y: lerp(cy + s3 * .3, st.l3.y, f), x: lerp(cx - textW(L.l3, F(900, size)) / 2, X, f), col: f < .55 ? OR.bright : '#fff' }; };
  // ---- İLK DƏFƏ in the centre: orange block + rising letters, pushed out upward at T2
  if (t < T2 + .1) {
    const w1 = textW(L.l1, F(900, s1)), ex = expoIn(prog(t, T2 - .22, .3));
    ctx.save(); ctx.beginPath(); ctx.rect(0, cy - s1 * 1.05, W, s1 * 1.32); ctx.clip();
    ctx.translate(0, -ex * s1 * 1.3);
    const hb = expoOut(prog(t, k, .4));
    ctx.fillStyle = OR.main; ctx.fillRect(cx - w1 / 2 - 34, cy - s1 * .88, (w1 + 68) * hb, s1 * 1.08);
    letters(L.l1, cx - w1 / 2, cy, s1, t, k + .08);
    ctx.restore();
  }
  // ---- “ARAZ”DA: rises in with echo at T2, lifts at T3, flies into the lockup at settle
  if (t >= T2) {
    const S = st2(t);
    if (t < T3) echo(L.l2, S.x, S.y, S.size, t, T2 + .08);
    const pin = expoOut(prog(t, T2 + .08, .4));
    const flying = t > s && t < s + .7;
    if (flying) { const q = st2(t); drawText(L.l2, q.x, q.y, q.size); }
    else { ctx.save(); ctx.beginPath(); ctx.rect(-50, S.y - S.size * 1.05, W + 100, S.size * 1.32); ctx.clip(); drawText(L.l2, S.x, S.y + (1 - pin) * S.size * 1.1, S.size); ctx.restore(); }
    shine(t, L.l2, S.x, S.y, S.size);
  }
  // ---- DİNLƏ: orange letters under ARAZ at T3, flies into the lockup and turns white
  if (t >= T3) {
    const S = st3(t);
    if (t < s) letters(L.l3, S.x, S.y, S.size, t, T3, { color: OR.bright, stagger: .04 });
    else if (t < s + .7) drawText(L.l3, S.x, S.y, S.size, { color: S.col });
    else drawText(L.l3, S.x, S.y, S.size);
  }
  // ---- lines that join in the lockup: İLK DƏFƏ, date, rolling time
  if (t >= s) {
    letters(L.l1, X, st.l1.y, st.l1.size, t, s + .62, { stagger: .025 });
    letters(L.date, X, st.date.y, st.date.size, t, s + .5, { w: 800, stagger: .02 });
    rolling(L.time, X, st.time.y, st.time.size, t, s + .65, { w: 600, color: 'rgba(255,255,255,0.93)' });
  }
}
function logo() {
  const P = CFG.logoPos, lw = P.w, lh = lw * LOGO.height / LOGO.width;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 12;
  ctx.drawImage(LOGO, W / 2 - lw / 2, P.y - lh / 2, lw, lh); ctx.restore();
}

/* beat pulse: 1 on a strong beat, decaying quickly (used for subtle "breathing") */
function pulse(t) { let v = 0; for (const b of (CFG.beats || [])) { if (b > t) break; v = Math.max(v, Math.exp(-(t - b) / .16)); } return v; }
/* brand grade: a touch of Araz teal in the shadows, skin stays natural */
function tealGrade() {
  const G = CFG.grade || { amount: .5 }; if (!G.amount) return;
  ctx.save(); ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = `rgba(9,93,106,${G.amount})`; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = `rgba(200,232,236,${G.amount * .25})`; ctx.fillRect(0, 0, W, H);
  ctx.restore();
}
const TA = mk(), TB = mk();
async function composeShot(idx, t, target) {      // footage + behind rows + person layer, into a canvas
  const S = CFG.shots, s = S[idx], end = idx + 1 < S.length ? S[idx + 1].start : CFG.duration;
  const prev = ctx; ctx = target.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const person = await drawShot(s, t, clamp((t - s.start) / (end - s.start)));
  behind(t);
  if (person) ctx.drawImage(PBUF, 0, 0);
  ctx = prev; return person;
}
async function footageLayer(t) {
  const { i, s } = shotAt(t), tr = s.trans;
  if (!tr || i === 0 || t >= s.start + tr.dur) { await composeShot(i, t, TA); ctx.drawImage(TA, 0, 0); return; }
  const q = (t - s.start) / tr.dur;
  if (tr.type === 'person') {
    // the incoming people appear first (cut out, over the old shot), then their background follows
    await composeShot(i - 1, t, TA); ctx.drawImage(TA, 0, 0);
    const person = await composeShot(i, t, TB);
    const fullA = clamp((q - .55) / .45);
    if (person) {
      const sc = lerp(1.06, 1, expoOut(q)), a = clamp(q * 4);
      ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, H / 2); ctx.scale(sc, sc); ctx.translate(-W / 2, -H / 2);
      ctx.shadowColor = 'rgba(63,193,207,0.75)'; ctx.shadowBlur = 40 * (1 - q); ctx.drawImage(PBUF, 0, 0); ctx.restore();
    }
    if (fullA > 0) { ctx.save(); ctx.globalAlpha = expoOut(fullA); ctx.drawImage(TB, 0, 0); ctx.restore(); }
  } else if (tr.type === 'push') {
    // clean zoom-push: the new shot lands from slightly closer, with radial-feel motion blur
    await composeShot(i, t, TB);
    const n = 6;
    BCTX.setTransform(1, 0, 0, 1, 0, 0); BCTX.globalCompositeOperation = 'source-over'; BCTX.globalAlpha = 1; BCTX.clearRect(0, 0, W, H);
    for (let k = 0; k < n; k++) {
      const sc = lerp(1.14, 1, expoOut(clamp(q - k * .03)));
      BCTX.save(); BCTX.globalCompositeOperation = 'lighter'; BCTX.globalAlpha = 1 / n;
      BCTX.translate(W / 2, H * .4); BCTX.scale(sc, sc); BCTX.translate(-W / 2, -H * .4); BCTX.drawImage(TB, 0, 0); BCTX.restore();
    }
    ctx.drawImage(BUF, 0, 0);
  } else if (tr.type === 'whip') {
    // directional whip pan with real motion blur, matched to the movement direction
    await composeShot(i - 1, t, TA); await composeShot(i, t, TB);
    const dir = tr.dir || -1, n = 8;
    BCTX.setTransform(1, 0, 0, 1, 0, 0); BCTX.globalCompositeOperation = 'source-over'; BCTX.globalAlpha = 1; BCTX.clearRect(0, 0, W, H);
    for (let k = 0; k < n; k++) {
      const qq = clamp(q - k * .045), off = expoIO(qq) * W * dir;
      BCTX.save(); BCTX.globalCompositeOperation = 'lighter'; BCTX.globalAlpha = 1 / n;
      BCTX.drawImage(TA, off, 0); BCTX.drawImage(TB, off - W * dir, 0); BCTX.restore();
    }
    ctx.drawImage(BUF, 0, 0);
  }
}
async function renderAt(t) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  await footageLayer(t);
  await split(t);
  tealGrade();
  grade();
  glints(t);
  panel(t);
  wipes(t);
  opening(t);
  const bp = t > A.settle + .9 ? pulse(t) : 0, L = CFG.lockup;
  ctx.save();
  if (bp > 0) { const sc = 1 + .014 * bp, ax = L.x, ay = L.style.l3.y; ctx.translate(ax, ay); ctx.scale(sc, sc); ctx.translate(-ax, -ay); }
  kinetic(t);
  ctx.restore();
  logo();
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .05;
  ctx.drawImage(GRAIN[Math.floor(t * CFG.fps) % GRAIN.length], 0, 0, W, H); ctx.restore();
}
window.init = async function (cfg) {
  CFG = cfg; A = cfg.anchors; LOGO = await loadImg(cfg.logo);
  for (const w of [600, 800, 900]) await document.fonts.load(`${w} 40px M`, 'İƏəŞĞÖÜÇ“”–0123456789');
  await document.fonts.ready; makeGrain(); return true;
};
window.frame = async function (i) { await renderAt(i / CFG.fps); return C.toDataURL('image/png'); };
</script></body></html>
